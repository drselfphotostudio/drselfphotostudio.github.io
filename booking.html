<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Booking</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins,sans-serif;
    }

    body{
      background:#000;
      color:white;
      padding:40px;
    }

    .container{
      max-width:1400px;
      margin:auto;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .header h1{
      font-size:42px;
    }

    .back-btn{
      background:#1d1d1d;
      color:white;
      padding:14px 20px;
      border-radius:14px;
      text-decoration:none;
    }

    .card{
      background:#111;
      padding:30px;
      border-radius:24px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th{
      background:#25D366;
      color:white;
      padding:18px;
      text-align:left;
    }

    td{
      padding:18px;
      border-bottom:1px solid #222;
    }

    .status{
      padding:8px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:600;
      display:inline-block;
    }

    .paid{
      background:#25D366;
      color:white;
    }

    .unpaid{
      background:#ffb800;
      color:black;
    }

  </style>
</head>
<body>

<div class="container">

  <div class="header">

    <h1>Customer Booking</h1>

    <a
      href="admin.html"
      class="back-btn"
    >
      ← Kembali Dashboard
    </a>

  </div>

<div
id="booking-section"
class="content-section"
>
<div class="table-wrapper">

<table>
  
<thead>
<tr>
  <th>Kode</th>
  <th>Nama</th>
  <th>WhatsApp</th>
  <th>Tanggal</th>
  <th>Jam</th>
  <th>Paket</th>
<th>Harga</th>
<th>Status</th>
<th>Upload Foto</th>
<th>Lihat Hasil</th>
<th>Kirim WA</th>
</tr>
</thead>

<tbody id="bookingTable">
</tbody>

</table>

</div>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function loadBookings(){

  const { data, error } =
await supabaseClient
  .from('bookings')
  .select(`
  *,
  packages (
    harga
  )
`)
    .order('created_at', {
      ascending:false
    });

  if(error){

    console.log(error);

    alert('Gagal load booking');

    return;

  }

  const bookingTable =
  document.getElementById('bookingTable');

  bookingTable.innerHTML =
  data.map(item => `

    <tr>

      <td>${item.kode_booking || '-'}</td>

<td>${item.nama || '-'}</td>

<td>${item.no_wa || '-'}</td>

<td>${item.tanggal || '-'}</td>

<td>${item.jam || '-'}</td>

<td>${item.paket || '-'}</td>
      <td>
        Rp ${item.packages?.harga || 0}
      </td>

      <td>

        <span class="
          status
          ${item.payment_status === 'paid'
            ? 'paid'
            : 'unpaid'}
        ">

          ${item.payment_status || 'unpaid'}

        </span>

      </td>

      <td>

<input
  type="file"
  onchange="uploadPhoto(event, ${item.id})"
>

</td>

      <td>

<a
  href="${item.result_url || '#'}"
  target="_blank"
  style="
    color:#25D366;
    text-decoration:none;
  "
>

Lihat

</a>

</td>

      <td>

<a
href="
https://wa.me/62${item.no_wa.substring(1)}
?text=Halo%20${item.nama},
%20hasil%20foto%20Anda%20sudah%20siap
"

target="_blank"

style="
color:#25D366;
text-decoration:none;
font-weight:600;
"
>

Kirim WA

</a>

</td>

    </tr>

  `).join('');

}

loadBookings();
  async function uploadPhoto(event, bookingId){

  const file =
  event.target.files[0];

  if(!file) return;

  const fileName =
  Date.now() + '-' + file.name;

  const { error: uploadError } =
  await supabaseClient.storage
    .from('customer-photo')
    .upload(fileName, file);

  if(uploadError){

    alert('Upload gagal');
    return;

  }

  const {
    data: publicUrlData
  } = supabaseClient.storage
    .from('customer-photo')
    .getPublicUrl(fileName);

  const photoUrl =
  publicUrlData.publicUrl;

  await supabaseClient
    .from('bookings')
    .update({
      result_url: photoUrl
    })
    .eq('id', bookingId);

  alert('Foto berhasil upload');

  loadBookings();

}

</script>
</body>
</html>
