<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Booking</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins,sans-serif;
    }

    body{
      background:#000;
      color:white;
      padding:40px;
    }

    .container{
      max-width:1400px;
      margin:auto;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .header h1{
      font-size:42px;
    }

    .back-btn{
      background:#1d1d1d;
      color:white;
      padding:14px 20px;
      border-radius:14px;
      text-decoration:none;
    }

    .card{
      background:#111;
      padding:30px;
      border-radius:24px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th{
      background:#25D366;
      color:white;
      padding:18px;
      text-align:left;
    }

    td{
  padding:18px;
  border-bottom:1px solid #222;
}

th,
td{
  white-space:nowrap;
}

    .status{
  padding:6px 12px;
      border-radius:999px;
      font-size:14px;
      font-weight:600;
      display:inline-block;
    }

    .paid{
      background:#25D366;
      color:white;
    }

    .unpaid{
      background:#ffb800;
      color:black;
    }
    .table-wrapper{
  overflow-x:auto;
}

  </style>
</head>
<body>

<div class="container">

  <div class="header">

    <h1>Customer Booking</h1>

    <a
      href="admin.html"
      class="back-btn"
    >
      ← Kembali Dashboard
    </a>

  </div>

<div
id="booking-section"
class="content-section"
>
<div class="table-wrapper">

<table>
  
<thead>
<tr>
  <th>Kode</th>
  <th>Nama</th>
  <th>WhatsApp</th>
  <th>Tanggal</th>
  <th>Jam</th>
  <th>Paket</th>
<th>Harga</th>
<th>Status</th>
<th>Upload Foto</th>
<th>Lihat Hasil</th>
<th>Kirim WA</th>
</tr>
</thead>

<tbody id="bookingTable">
</tbody>

</table>

</div>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function loadBookings(){

  const { data, error } =
await supabaseClient
  .from('bookings')
  .select(`
  *,
  packages (
    price
  )
`)
    .order('created_at', {
      ascending:false
    });

  if(error){

    console.log(error);

    alert('Gagal load booking');

    return;

  }

  const bookingTable =
  document.getElementById('bookingTable');

  bookingTable.innerHTML =
  data.map(item => `

    <tr>

      <td>${item.kode_booking || '-'}</td>

<td>${item.nama || '-'}</td>

<td>${item.no_wa || '-'}</td>

<td>${item.tanggal || '-'}</td>

<td>${item.jam || '-'}</td>

<td>${item.paket || '-'}</td>
      <td>
        ${item.packages?.price || 'Rp 0'}
      </td>

      <td>

${
  item.payment_status === 'paid'
  ?

  `
    <span class="status paid">
      Paid
    </span>
  `

  :

  `
    <div style="display:flex;flex-direction:column;gap:8px;">
      <span class="status unpaid">
        Menunggu Pembayaran
      </span>

      <button
        onclick="approvePayment(${item.id})"
        style="
          background:#25D366;
          color:white;
          border:none;
          padding:10px 16px;
          border-radius:999px;
          cursor:pointer;
          font-weight:600;
        "
      >
        Approve
      </button>
    </div>
  `
}

</td>

      <td>

${
  item.payment_status === 'paid'
  ?

  `
    <div style="display:flex;flex-direction:column;gap:8px;">

      <input
        type="file"
        accept="image/*"
        multiple
        onchange="uploadPhoto(event, ${item.id})"
      >

      ${
        item.result_url
        ?
        `
          <span style="
            color:#25D366;
            font-size:14px;
            font-weight:600;
          ">
            ✅ ${item.result_url.split(',').length} foto sudah diupload
          </span>
        `
        :
        `
          <span style="
            color:#666;
            font-size:14px;
          ">
            Belum ada foto
          </span>
        `
      }

    </div>
  `

  :

  `
    <span style="color:#ffb800;font-weight:600;">
      Menunggu approve pembayaran
    </span>
  `
}

</td>

      <td>

${
  item.result_url
  ?

  `
    <a
      href="${item.result_url.split(',')[0]}"
      target="_blank"
      style="
        color:#25D366;
        text-decoration:none;
        font-weight:600;
      "
    >
      Lihat
    </a>
  `

  :

  `
    <span style="color:#666;">
      Belum ada
    </span>
  `
}

</td>

      <td>

${
  item.result_url
  ?

  `
    <a
    href="
    https://wa.me/62${item.no_wa.substring(1)}
    ?text=Halo%20${item.nama},
    %20hasil%20foto%20Anda%20sudah%20siap:
    %20${item.result_url}
    "
    target="_blank"
    style="
    color:#25D366;
    text-decoration:none;
    font-weight:600;
    "
    >
    Kirim WA
    </a>
  `

  :

  `
    <span style="color:#666;">
      Belum ada
    </span>
  `
}

</td>

    </tr>

  `).join('');

}

loadBookings();
  async function uploadPhoto(event, bookingId){

  const files =
  event.target.files;

  if(!files.length) return;

  let uploadedUrls = [];

  for(const file of files){

    const fileName =
    Date.now() + '-' + file.name;

    const { error: uploadError } =
    await supabaseClient.storage
      .from('customer-photo')
      .upload(fileName, file);

    if(uploadError){

      alert('Upload gagal');
      return;

    }

    const {
      data: publicUrlData
    } = supabaseClient.storage
      .from('customer-photo')
      .getPublicUrl(fileName);

    uploadedUrls.push(
      publicUrlData.publicUrl
    );

  }

  await supabaseClient
    .from('bookings')
    .update({
      result_url:
      uploadedUrls.join(',')
    })
    .eq('id', bookingId);

  alert('Semua foto berhasil upload');

  loadBookings();

}
async function approvePayment(id){

  await supabaseClient
    .from('bookings')
    .update({
      payment_status:'paid'
    })
    .eq('id', id);

  loadBookings();

}
</script>
</body>
</html>
