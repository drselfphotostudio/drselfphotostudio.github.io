<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hasil Foto Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  box-sizing:border-box;
}

.container{
  max-width:1200px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:30px;
}

.search-box input{
  flex:1;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:16px;
  box-sizing:border-box;
}

.search-box button{
  background:#25D366;
  border:none;
  color:white;
  padding:15px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.photo-card{
  background:#1e1e1e;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.photo-card img{
  width:100%;
  display:block;
}

.photo-info{
  padding:15px;
}

.photo-info label{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.download-btn{
  margin-top:10px;
  width:100%;
  background:#25D366;
  border:none;
  color:white;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

#status{
  text-align:center;
  margin-bottom:20px;
  opacity:0.8;
}

#printBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  border:none;
  padding:15px 20px;
  border-radius:50px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
  display:none;
}

.empty{
  text-align:center;
  opacity:0.7;
  margin-top:50px;
}

</style>
</head>

<body>

<div class="container">

<h1>Hasil Foto Studio</h1>

<div class="search-box">

<input
  type="text"
  id="kodeBooking"
  placeholder="Masukkan kode booking"
>

<button onclick="loadPhotos()">
  Tampilkan
</button>

</div>

<div id="status"></div>

<div class="gallery" id="gallery"></div>

<div class="empty" id="empty"></div>

</div>

<button id="printBtn" onclick="sendPrintRequest()">
  Pesan Cetak
</button>

<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

let selectedPhotos = [];

async function loadPhotos(){

  const kodeBooking =
    document.getElementById('kodeBooking')
    .value
    .trim();

  if(!kodeBooking){

    alert('Masukkan kode booking');

    return;
  }

  const gallery =
    document.getElementById('gallery');

  const status =
    document.getElementById('status');

  const empty =
    document.getElementById('empty');

  gallery.innerHTML = '';

  empty.innerHTML = '';

  status.innerHTML =
    'Mengambil foto...';

  const { data, error } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list(kodeBooking);

  if(error){

    console.log(error);

    status.innerHTML =
      'Gagal mengambil foto';

    return;
  }

  if(!data || data.length === 0){

    status.innerHTML = '';

    empty.innerHTML =
      'Belum ada foto untuk kode booking ini';

    return;
  }

  status.innerHTML =
    `${data.length} foto ditemukan`;

  data.forEach(file => {

    const imageUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`;

    gallery.innerHTML += `

<div class="photo-card">

<img src="${imageUrl}">

<div class="photo-info">

<label>

<input
  type="checkbox"
  value="${file.name}"
  onchange="togglePhoto(this)"
>

Pilih untuk cetak

</label>

<button
class="download-btn"
onclick="downloadPhoto('${imageUrl}')"
>
  Download
</button>

</div>

</div>

    `;

  });

}

function togglePhoto(checkbox){

  if(checkbox.checked){

    selectedPhotos.push(
      checkbox.value
    );

  }else{

    selectedPhotos =
      selectedPhotos.filter(
        item => item !== checkbox.value
      );

  }

  const printBtn =
    document.getElementById('printBtn');

  if(selectedPhotos.length > 0){

    printBtn.style.display =
      'block';

  }else{

    printBtn.style.display =
      'none';

  }

}

function downloadPhoto(url){

  window.open(url, '_blank');

}

function sendPrintRequest(){

  const kodeBooking =
    document.getElementById('kodeBooking')
    .value
    .trim();

  const pesan =
`Halo Admin 👋

Saya ingin cetak foto berikut:

Kode Booking:
${kodeBooking}

Foto dipilih:
${selectedPhotos.join('\n')}

Terima kasih`;

  const nomorAdmin =
'6285655194918';

  const waUrl =
`https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`;

  window.open(waUrl, '_blank');

}

const params =
new URLSearchParams(window.location.search);

const autoKode =
params.get('id');

if(autoKode){

  document.getElementById('kodeBooking')
    .value = autoKode;

  loadPhotos();

}

</script>

</body>
</html>
