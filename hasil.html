<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hasil Foto Studio – DrSelf</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;}
::-webkit-scrollbar{display:none;}

body{
  background:#08080a;
  color:#e8e8f0;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HERO ── */
.hero{
  text-align:center;
  padding:56px 20px 40px;
  position:relative;
}
.hero::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:600px;height:280px;
  background:radial-gradient(ellipse at top,rgba(127,119,221,0.16) 0%,transparent 70%);
  pointer-events:none;
}
.studio-badge{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(127,119,221,0.1);border:0.5px solid rgba(127,119,221,0.25);
  border-radius:20px;padding:5px 14px;
  font-size:12px;color:#AFA9EC;font-weight:500;margin-bottom:22px;letter-spacing:0.04em;
}
.hero h1{font-size:46px;font-weight:800;color:#fff;line-height:1.1;margin-bottom:10px;}
.hero h1 span{background:linear-gradient(135deg,#7F77DD,#AFA9EC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-sub{font-size:14px;color:#555;margin-bottom:28px;}
.back-btn{
  display:inline-flex;align-items:center;gap:7px;
  background:#131318;border:0.5px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:9px 18px;
  color:#888;font-size:13px;cursor:pointer;text-decoration:none;
  transition:background 0.15s,color 0.15s;
}
.back-btn:hover{background:#1e1e26;color:#ddd;}

/* ── SEARCH ── */
.search-wrap{
  max-width:540px;margin:0 auto 32px;
  background:#131318;border:0.5px solid rgba(255,255,255,0.08);
  border-radius:14px;padding:18px 20px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.search-label{font-size:12px;color:#AFA9EC;font-weight:500;white-space:nowrap;}
.search-input{
  flex:1;min-width:180px;
  background:#1e1e26;color:#fff;
  border:0.5px solid rgba(255,255,255,0.08);border-radius:9px;
  padding:10px 14px;font-size:13px;font-family:'Poppins',sans-serif;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.search-input:focus{outline:none;border-color:#7F77DD;box-shadow:0 0 0 3px rgba(127,119,221,0.15);}
.search-input::placeholder{color:#444;}
.search-btn{
  background:#7F77DD;border:none;border-radius:9px;
  padding:10px 18px;color:#fff;font-size:13px;font-weight:600;
  font-family:'Poppins',sans-serif;cursor:pointer;
  transition:background 0.15s;white-space:nowrap;
}
.search-btn:hover{background:#6b63c9;}

/* ── STATUS CARD ── */
.status-card{
  max-width:1100px;margin:0 auto 24px;
  background:#131318;border:0.5px solid rgba(255,255,255,0.07);
  border-radius:14px;padding:18px 22px;
  display:flex;align-items:center;gap:16px;
}
.status-icon-wrap{
  width:44px;height:44px;border-radius:11px;
  background:rgba(127,119,221,0.12);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.status-info{flex:1;min-width:0;}
.status-title{font-size:15px;font-weight:600;color:#ddd;}
.status-sub{font-size:12px;color:#555;margin-top:2px;}
.status-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:20px;font-size:11.5px;font-weight:500;
  margin-top:7px;
}
.pill-waiting{background:rgba(186,117,23,0.12);color:#EF9F27;}
.pill-found{background:rgba(29,158,117,0.12);color:#1D9E75;}
.pill-error{background:rgba(226,75,74,0.1);color:#E24B4A;}
.status-actions{display:flex;gap:8px;flex-shrink:0;}
.sel-all-btn{
  background:#1e1e26;border:0.5px solid rgba(255,255,255,0.08);
  border-radius:8px;padding:7px 13px;color:#888;font-size:12px;
  font-family:'Poppins',sans-serif;cursor:pointer;transition:background 0.15s;
}
.sel-all-btn:hover{background:#282830;color:#ddd;}

/* ── MODE PICKER ── */
.mode-section{max-width:1100px;margin:0 auto 20px;padding:0 20px;}
.mode-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px;}
.mode-picker{display:flex;gap:10px;flex-wrap:wrap;}
.mode-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:#131318;border:0.5px solid rgba(255,255,255,0.08);
  border-radius:12px;overflow:hidden;cursor:pointer;
  transition:border-color 0.2s,transform 0.2s;width:100px;
  font-family:'Poppins',sans-serif;
}
.mode-btn:hover{border-color:rgba(127,119,221,0.35);transform:translateY(-2px);}
.mode-btn.active{border-color:#7F77DD;background:rgba(127,119,221,0.08);}
.mode-btn-img{width:100%;height:90px;object-fit:cover;display:block;}
.mode-btn-placeholder{width:100%;height:90px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#1e1e26;}
.mode-btn-label{font-size:11px;font-weight:500;color:#888;padding:6px 4px;text-align:center;}
.mode-btn.active .mode-btn-label{color:#AFA9EC;}

/* ── SLOT SELECTOR ── */
.slot-panel{
  max-width:1100px;margin:0 auto 20px;
  background:#131318;border:0.5px solid rgba(255,255,255,0.07);
  border-radius:14px;padding:18px 20px;
  display:none;
}
.slot-panel h3{font-size:14px;font-weight:600;color:#ddd;margin-bottom:14px;}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.slot-select{
  background:#1e1e26;color:#ddd;border:0.5px solid rgba(255,255,255,0.08);
  border-radius:8px;padding:8px 12px;font-size:12px;font-family:'Poppins',sans-serif;
  width:100%;cursor:pointer;
}
.slot-label{font-size:11px;color:#555;margin-bottom:5px;}

/* ── GALLERY ── */
.gallery-wrap{max-width:1100px;margin:0 auto;padding:0 20px 80px;}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px;
}
.photo-card{
  background:#131318;border:0.5px solid rgba(255,255,255,0.07);
  border-radius:14px;overflow:hidden;position:relative;
  transition:border-color 0.2s,transform 0.2s;
  display:flex;flex-direction:column;
}
.photo-card:hover{border-color:rgba(127,119,221,0.35);transform:translateY(-3px);}
.photo-num{
  position:absolute;top:10px;left:10px;
  background:rgba(10,10,12,0.7);backdrop-filter:blur(6px);
  border:0.5px solid rgba(255,255,255,0.1);
  color:#AFA9EC;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:6px;z-index:5;font-family:monospace;
}
.photo-card img{
  width:100%;aspect-ratio:4/5;object-fit:cover;display:block;
  cursor:zoom-in;transition:opacity 0.2s;
}
.photo-card img:hover{opacity:0.88;}
.photo-info{
  padding:12px 14px 14px;
  border-top:0.5px solid rgba(255,255,255,0.05);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.photo-fname{font-size:11px;color:#555;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.print-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(127,119,221,0.1);border:0.5px solid rgba(127,119,221,0.2);
  border-radius:7px;padding:5px 10px;color:#AFA9EC;font-size:11.5px;
  font-family:'Poppins',sans-serif;cursor:pointer;white-space:nowrap;transition:background 0.15s;
}
.print-btn:hover{background:rgba(127,119,221,0.2);}

/* ── PHOTOSTRIP ── */
.photostrip-wrap{
  max-width:640px;margin:0 auto;padding:0 20px 80px;
  display:flex;justify-content:center;
}
.photostrip{position:relative;width:600px;height:1750px;}
.photostrip .slot{position:absolute;object-fit:cover;border-radius:22px;}
.photostrip-template{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;}

/* ── STATE ── */
.state-wrap{
  max-width:1100px;margin:0 auto;
  text-align:center;padding:60px 20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.state-icon{font-size:44px;}
.state-title{font-size:15px;font-weight:600;color:#ddd;}
.state-sub{font-size:13px;color:#555;}

/* ── MODAL ── */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.92);backdrop-filter:blur(8px);
  display:none;justify-content:center;align-items:center;
  z-index:9999;padding:20px;
}
.modal.open{display:flex;}
.modal-inner{position:relative;max-width:95vw;max-height:95vh;}
.modal img{max-width:95vw;max-height:90vh;border-radius:14px;object-fit:contain;display:block;cursor:grab;}
.modal-close{
  position:absolute;top:-14px;right:-14px;
  width:32px;height:32px;
  background:#1e1e26;border:0.5px solid rgba(255,255,255,0.1);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;color:#aaa;transition:background 0.15s;
}
.modal-close:hover{background:#2e2e3a;color:#fff;}
.modal-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:36px;background:rgba(30,30,38,0.85);
  border:0.5px solid rgba(255,255,255,0.1);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#ddd;font-size:18px;transition:background 0.15s;
}
.modal-nav:hover{background:rgba(127,119,221,0.25);}
.modal-prev{left:-48px;}
.modal-next{right:-48px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:#1e1e26;border:0.5px solid rgba(127,119,221,0.3);
  border-radius:10px;padding:10px 16px;
  font-size:13px;color:#AFA9EC;
  opacity:0;transform:translateY(8px);
  transition:opacity 0.2s,transform 0.2s;pointer-events:none;z-index:99999;
}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:600px){
  .hero h1{font-size:32px;}
  .gallery{grid-template-columns:1fr 1fr;}
  .modal-prev{left:-10px;}
  .modal-next{right:-10px;}
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="studio-badge">📸 DR Self Photo Studio</div>
  <h1>Hasil <span>Foto</span> Studio</h1>
  <p class="hero-sub">Cari dan lihat hasil foto berdasarkan kode booking</p>
  <button class="back-btn" id="backBtn" onclick="window.location.href='booking.html'" style="display:none;">← Kembali ke Customer Booking</button>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <span class="search-label">🔖 Kode Booking</span>
  <input type="text" id="searchKode" class="search-input" placeholder="Masukkan kode booking..." onkeypress="if(event.key==='Enter')searchAlbum()">
  <button class="search-btn" onclick="searchAlbum()">🔍 Cari Foto</button>
</div>

<!-- STATUS -->
<div class="status-card" id="statusCard">
  <div class="status-icon-wrap">🖼️</div>
  <div class="status-info">
    <div class="status-title" id="statusTitle">Belum ada pencarian</div>
    <div class="status-sub" id="statusSub">Masukkan kode booking di atas</div>
    <div class="status-pill pill-waiting" id="statusPill">Menunggu Pencarian</div>
  </div>
  <div class="status-actions">
    <button class="sel-all-btn" onclick="selectAllPhotos()">☑ Pilih Semua</button>
  </div>
</div>

<!-- MODE PICKER -->
<div class="mode-section" id="modeSection" style="display:none;">
  <div class="mode-label">Pilih tampilan</div>
  <div class="mode-picker" id="templateContainer"></div>
</div>

<!-- SLOT SELECTOR -->
<div class="slot-panel" id="slotPanel">
  <h3>Atur Posisi Foto di Photostrip</h3>
  <div class="slot-grid" id="slotSelector"></div>
</div>

<!-- GALLERY / PHOTOSTRIP -->
<div class="gallery-wrap" id="galleryWrap">
  <div class="state-wrap" id="stateWrap" style="display:none;"></div>
  <div class="gallery" id="gallery"></div>
</div>
<div class="photostrip-wrap" id="photostripWrap" style="display:none;">
  <div class="photostrip" id="photostripEl"></div>
</div>

<!-- PREVIEW MODAL -->
<div class="modal" id="previewModal" onclick="handleModalBg(event)">
  <div class="modal-inner">
    <div class="modal-close" onclick="closePreview()">×</div>
    <div class="modal-nav modal-prev" onclick="navPhoto(-1)">‹</div>
    <img id="previewImage" src="" alt="Preview">
    <div class="modal-nav modal-next" onclick="navPhoto(1)">›</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';
const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const urlParams     = new URLSearchParams(window.location.search);
const kodeFromUrl   = urlParams.get('kode') || '';
const isAdmin       = urlParams.get('admin') === '1';

let allTemplates    = [];
let currentImages   = [];
let currentIndex    = 0;
let currentMode     = 'original';
let currentTemplate = '';
let currentTemplateData = null;
let currentKode     = '';
let panzoomInstance = null;

// show back btn for admin
if(isAdmin) document.getElementById('backBtn').style.display = 'inline-flex';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function setStatus(icon, title, sub, pillClass, pillTxt){
  document.querySelector('.status-icon-wrap').textContent = icon;
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusSub').textContent   = sub;
  const p = document.getElementById('statusPill');
  p.className = 'status-pill '+pillClass;
  p.textContent = pillTxt;
}

function setState(icon, title, sub){
  const w = document.getElementById('stateWrap');
  w.style.display = 'flex';
  w.innerHTML = `<div class="state-icon">${icon}</div><div class="state-title">${title}</div><div class="state-sub">${sub}</div>`;
  document.getElementById('gallery').innerHTML = '';
}

function clearState(){
  document.getElementById('stateWrap').style.display = 'none';
}

/* ── TEMPLATES ── */
async function loadTemplates(){
  try{
    const {data,error} = await supabaseClient.from('template').select('*').order('id',{ascending:true});
    if(error) throw error;
    allTemplates = data||[];
    buildModePicker();
  }catch(e){ console.warn('loadTemplates error', e); buildModePicker(); }
}

function buildModePicker(){
  const c = document.getElementById('templateContainer');
  c.innerHTML = '';

  // Original
  const orig = document.createElement('button');
  orig.className = 'mode-btn active';
  orig.id = 'modeBtn-original';
  orig.onclick = ()=>setMode('original','',null);
  orig.innerHTML = `<div class="mode-btn-placeholder">🖼️</div><div class="mode-btn-label">Tanpa Frame</div>`;
  c.appendChild(orig);

  // Stop Motion
  const sm = document.createElement('button');
  sm.className = 'mode-btn';
  sm.onclick = openStopmotion;
  sm.innerHTML = `<div class="mode-btn-placeholder">🎞️</div><div class="mode-btn-label">Stop Motion</div>`;
  c.appendChild(sm);

  allTemplates.forEach(item=>{
    const btn = document.createElement('button');
    btn.className = 'mode-btn';
    btn.id = 'modeBtn-'+item.id;
    btn.onclick = ()=>setMode('template', item.image_url, item.id);
    btn.innerHTML = `<img class="mode-btn-img" src="${item.image_url}" alt="${item.name}"><div class="mode-btn-label">${item.name}</div>`;
    c.appendChild(btn);
  });
}

function setMode(mode, templateUrl, templateId){
  currentMode = mode;
  currentTemplate = templateUrl;
  currentTemplateData = templateId ? allTemplates.find(t=>t.id==templateId) : null;

  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  const active = document.getElementById('modeBtn-'+(templateId||'original'));
  if(active) active.classList.add('active');

  if(currentKode) openAlbum(currentKode);
}

/* ── SEARCH / OPEN ALBUM ── */
function searchAlbum(){
  const kode = document.getElementById('searchKode').value.trim();
  if(!kode){ showToast('Masukkan kode booking dulu'); return; }
  openAlbum(kode);
}

async function openAlbum(kode){
  currentKode   = kode;
  currentImages = [];
  document.getElementById('searchKode').value = kode;
  document.getElementById('modeSection').style.display = 'block';
  document.getElementById('photostripWrap').style.display = 'none';
  document.getElementById('galleryWrap').style.display = 'block';
  setState('⏳','Mengambil foto...','Mohon tunggu sebentar');
  setStatus('⏳','Mengambil foto...','Kode: '+kode,'pill-waiting','Memuat...');

  try{
    const {data:files,error} = await supabaseClient.storage
      .from('customer-photo').list(kode,{sortBy:{column:'name',order:'asc'}});
    if(error) throw error;

    const photos = (files||[]).filter(f=>f.name!=='.keep' && f.name!=='');

    if(!photos.length){
      setState('📭','Foto belum tersedia','Foto sedang diproses. Coba beberapa saat lagi.');
      setStatus('📭',kode,'Belum ada foto tersedia','pill-error','Tidak Ditemukan');
      return;
    }

    currentImages = photos.map(f=>`${supabaseUrl}/storage/v1/object/public/customer-photo/${kode}/${f.name}`);
    setStatus('✅',photos.length+' Foto Ditemukan','Kode: '+kode,'pill-found','Siap Dilihat');
    clearState();

    if(currentMode === 'original'){
      renderGallery(photos, kode);
      document.getElementById('slotPanel').style.display = 'none';
    }else if(currentTemplateData){
      renderPhotostrip();
      generateSlotSelector();
      document.getElementById('slotPanel').style.display = 'block';
    }
  }catch(err){
    console.error('openAlbum error:', err);
    setState('⚠️','Gagal memuat foto','Periksa koneksi internet dan coba lagi.');
    setStatus('⚠️','Gagal memuat','Error saat mengambil data','pill-error','Error');
  }
}

function renderGallery(photos, kode){
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  photos.forEach((file,index)=>{
    const url   = `${supabaseUrl}/storage/v1/object/public/customer-photo/${kode}/${file.name}`;
    const label = String(index+1).padStart(2,'0');
    const card  = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `
      <div class="photo-num">${label}</div>
      <img src="${url}" loading="lazy" alt="Foto ${label}" onclick="openPreview(${index})">
      <div class="photo-info">
        <span class="photo-fname">${file.name}</span>
        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
      </div>`;
    gallery.appendChild(card);
  });
}

/* ── PHOTOSTRIP ── */
function renderPhotostrip(){
  if(!currentTemplateData) return;
  const el = document.getElementById('photostripEl');
  el.innerHTML = '';
  el.style.width  = '600px';
  el.style.height = '1750px';

  for(let i=1; i<=currentTemplateData.total_slot; i++){
    const selEl = document.getElementById('slot'+i);
    const idx   = selEl ? parseInt(selEl.value)||0 : 0;
    const img   = document.createElement('img');
    img.src   = currentImages[idx]||'';
    img.className = 'slot';
    img.style.cssText = `top:${currentTemplateData['slot'+i+'_top']}px;left:${currentTemplateData['slot'+i+'_left']}px;width:${currentTemplateData['slot'+i+'_width']}px;height:${currentTemplateData['slot'+i+'_height']}px;`;
    el.appendChild(img);
  }
  const tpl = document.createElement('img');
  tpl.src = currentTemplate;
  tpl.className = 'photostrip-template';
  el.appendChild(tpl);

  document.getElementById('galleryWrap').style.display  = 'none';
  document.getElementById('photostripWrap').style.display = 'block';
}

function generateSlotSelector(){
  const c = document.getElementById('slotSelector');
  c.innerHTML = '';
  const total = currentTemplateData?.total_slot||4;
  for(let i=1;i<=total;i++){
    const wrap = document.createElement('div');
    const lbl  = document.createElement('div');
    lbl.className = 'slot-label';
    lbl.textContent = 'Slot '+i;
    const sel  = document.createElement('select');
    sel.id = 'slot'+i;
    sel.className = 'slot-select';
    sel.onchange  = renderPhotostrip;
    currentImages.forEach((url,idx)=>{
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = 'Foto '+(idx+1);
      if(idx===i-1) opt.selected = true;
      sel.appendChild(opt);
    });
    wrap.appendChild(lbl);
    wrap.appendChild(sel);
    c.appendChild(wrap);
  }
}

/* ── PREVIEW ── */
function openPreview(index){
  currentIndex = index;
  const img = document.getElementById('previewImage');
  img.src = currentImages[index];
  document.getElementById('previewModal').classList.add('open');
  document.body.style.overflow = 'hidden';

  img.onload = ()=>{
    if(panzoomInstance){ panzoomInstance.destroy(); panzoomInstance=null; }
    panzoomInstance = Panzoom(img,{maxScale:5,minScale:1,contain:'automatic',cursor:'grab'});
    img.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
  };
}

function navPhoto(dir){
  currentIndex = (currentIndex+dir+currentImages.length)%currentImages.length;
  const img = document.getElementById('previewImage');
  img.src = currentImages[currentIndex];
}

function closePreview(){
  document.getElementById('previewModal').classList.remove('open');
  document.body.style.overflow = '';
  if(panzoomInstance){ panzoomInstance.destroy(); panzoomInstance=null; }
}

function handleModalBg(e){
  if(e.target===document.getElementById('previewModal')) closePreview();
}

/* ── KEYBOARD & SWIPE ── */
document.addEventListener('keydown',e=>{
  if(!document.getElementById('previewModal').classList.contains('open')) return;
  if(e.key==='ArrowRight') navPhoto(1);
  if(e.key==='ArrowLeft')  navPhoto(-1);
  if(e.key==='Escape')     closePreview();
});
let touchStartX=0;
document.getElementById('previewModal').addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX;});
document.getElementById('previewModal').addEventListener('touchend',e=>{
  const diff=e.changedTouches[0].screenX-touchStartX;
  if(diff<-50) navPhoto(1);
  if(diff>50)  navPhoto(-1);
});

/* ── MISC ── */
function selectAllPhotos(){ showToast('Fitur pilih semua sedang disiapkan'); }

function openStopmotion(){
  const kode = currentKode || document.getElementById('searchKode').value.trim();
  if(!kode){ showToast('Cari foto dulu'); return; }
  window.location.href = `stopmotion.html?kode=${kode}${isAdmin?'&admin=1':''}`;
}

/* ── INIT ── */
loadTemplates();

window.addEventListener('DOMContentLoaded',()=>{
  if(kodeFromUrl){
    document.getElementById('searchKode').value = kodeFromUrl;
    openAlbum(kodeFromUrl);
  }
});
</script>
