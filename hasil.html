<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hasil Foto Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  .photostrip{
  position:relative;
  width:600px;
  height:1750px;
  margin:-250px auto 0;
}

.photostrip .slot{
  position:absolute;
  object-fit:cover;
  border-radius:22px;
}

.photostrip-template{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}
  .strip-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  overflow:hidden;
  border-radius:20px;
}

.photo-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
}

.strip-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}
.mode-picker{
  display:flex;
  gap:20px;
  justify-content:center;
  align-items:flex-start;
  margin:30px 0;
  flex-wrap:wrap;
}

.mode-picker button{
  background:#1f1f1f;
  border:2px solid #25D366;
  color:white;
  padding:12px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}

.mode-picker button:hover{
  background:#25D366;
}
  .template-btn{
  width:120px;
  background:#1e1e1e;
  border:2px solid #25D366;
  border-radius:22px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
  color:white;
}

.template-btn:hover{
  transform:translateY(-5px);
  background:#25D366;
}

.template-btn img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.template-btn p{
  margin:10px 0;
  text-align:center;
  font-weight:600;
}
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  box-sizing:border-box;
  min-height:100vh;
  overflow-x:hidden;
}
  *{
  scroll-behavior:smooth;
}
  *{
  scrollbar-width:none;
}

::-webkit-scrollbar{
  display:none;
}

.container{
  max-width:1400px;
  margin:auto;
  padding-bottom:100px;
}

h1{
  text-align:center;
  margin-bottom:35px;
  font-size:42px;
  font-weight:800;
  letter-spacing:1px;
}

.album-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.album-card{
  background:#1e1e1e;
  border-radius:20px;
  padding:25px;
  cursor:pointer;
  transition:0.2s;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

.album-card:hover{
  transform:translateY(-5px);
  background:#25D366;
}
.album-card h3{
  margin:0;
  font-size:20px;
}

.album-card:hover h3{
  color:white;
}
.album-icon{
  font-size:50px;
  margin-bottom:15px;
}

.album-card:hover{
  box-shadow:0 10px 30px rgba(37,211,102,0.25);
}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:24px;
  padding-bottom:120px;
  align-items:start;
}

.photo-card img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  display:block;
  transition:0.3s;
  border-bottom:1px solid rgba(255,255,255,0.05);
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
  will-change:transform;
}

  .photo-card{
  background:#181818;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  transition:0.25s;
  display:flex;
  flex-direction:column;
  border:1px solid rgba(255,255,255,0.04);
  backdrop-filter:blur(10px);
}
  .photo-info{
  padding:18px;
  background:#181818;
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:auto;
}

.photo-card::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.25),
    transparent
  );
  opacity:0;
  transition:0.25s;
  pointer-events:none;
}

.photo-card:hover::after{
  opacity:1;
}
.photo-card:hover img{
  transform:scale(1.03);
}
 
.photo-card:hover{
  transform:translateY(-5px);
  box-shadow:
0 10px 30px rgba(0,0,0,0.35),
0 0 0 1px rgba(37,211,102,0.08);
}

.photo-info label{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.download-btn{
  width:100%;
  background:#25D366;
  border:none;
  color:white;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:0.2s;
}

.download-btn:hover{
  opacity:0.9;
  transform:translateY(-2px);
}
.download-btn:active{
  transform:scale(0.98);
}
#status{
  text-align:center;
  margin-bottom:20px;
  opacity:0.8;
}

#printBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#25D366;
  color:white;
  border:none;
  padding:16px 24px;
  border-radius:50px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:none;
  box-shadow:0 10px 30px rgba(37,211,102,0.35);
  transition:0.2s;
}

#printBtn:hover{
  transform:translateY(-3px);
}

.back-btn{
  margin-bottom:30px;
  background:#25D366;
  border:none;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  cursor:pointer;
  display:none;
  font-size:15px;
  font-weight:600;
  transition:0.2s;
}

.back-btn:hover{
  transform:translateY(-2px);
}
#previewModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
  box-sizing:border-box;
}

#previewModal img{
  width:auto;
  height:auto;
  max-width:90vw;
  max-height:90vh;
  display:block;
  margin:auto;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  object-fit:contain;
  animation:zoomPreview 0.2s ease;
  cursor:grab;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
}
  @keyframes zoomPreview{
  from{
    transform:scale(0.95);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}
#previewModal{
  animation:fadePreview 0.2s ease;
}

@keyframes fadePreview{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}
#previewModal span{
  position:absolute;
  top:20px;
  right:25px;
  font-size:35px;
  color:white;
  cursor:pointer;
  transition:0.2s;
}
  #previewModal span:hover{
  transform:scale(1.1);
  opacity:0.8;
}
  .nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:60px;
  height:60px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  color:white;
  font-size:32px;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:0.2s;
  z-index:10000;
}

.nav-btn:hover{
  background:rgba(255,255,255,0.25);
}

.left{
  left:20px;
}

.right{
  right:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Hasil Foto Studio</h1>
  <div style="
display:flex;
gap:10px;
justify-content:center;
margin-bottom:30px;
flex-wrap:wrap;
">

<input
type="text"
id="searchKode"
placeholder="Masukkan Kode Booking"
style="
padding:14px 18px;
border:none;
border-radius:12px;
width:280px;
font-size:16px;
outline:none;
"
>

<button
onclick="searchAlbum()"
style="
background:#25D366;
border:none;
padding:14px 20px;
border-radius:12px;
color:white;
font-weight:600;
cursor:pointer;
"
>
Cari Foto
</button>

</div>

<div id="albumList" class="album-grid"></div>

<div id="status"></div>
  <div class="mode-picker">
    <div id="photoSelector" style="
display:none;
max-width:500px;
margin:20px auto;
background:#1a1a1a;
padding:20px;
border-radius:20px;
">

<h3>Pilih Foto Photostrip</h3>

<div style="display:grid;gap:15px;">

<div id="slotSelector"></div>

</div>

</div>
<div
id="templateContainer"
class="mode-picker">
</div>

</div>

<div class="gallery" id="gallery"></div>
<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

let selectedPhotos = [];
  let currentMode = 'original';
let currentTemplate = '';
  let currentTemplateData = null;
  let allTemplates = [];
let currentKodeBooking = '';

const urlParams =
new URLSearchParams(window.location.search);

const kodeBooking =
urlParams.get('kode');

loadTemplates();

if(kodeBooking){

  openAlbum(kodeBooking);

}else{

  loadAlbums();

}

async function loadAlbums(){

  const albumList =
    document.getElementById('albumList');

  const status =
    document.getElementById('status');

  status.innerHTML =
  '📁 Mengambil album...';

  const { data, error } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list('', {
        limit:100
      });

  if(error){

    console.log(error);

    status.innerHTML =
      'Gagal mengambil album';

    return;
  }

  status.innerHTML = '';

  albumList.innerHTML = '';

  data.forEach(folder => {

    if(folder.id === null){

      albumList.innerHTML += `

<div
class="album-card"
onclick="openAlbum('${folder.name}')"
>

<div class="album-icon">
📁
</div>

<h3>${folder.name}</h3>

</div>

      `;

    }

  });

}

async function openAlbum(kodeBooking){

  currentKodeBooking = kodeBooking;

  selectedPhotos = [];

  document.getElementById('albumList')
    .style.display = 'none';

    const gallery =
    document.getElementById('gallery');

  const status =
    document.getElementById('status');

  gallery.innerHTML = '';

  status.innerHTML =
  '📸 Mengambil foto...';

  const { data, error } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list(kodeBooking);

    if(error){

    console.log(error);

    status.innerHTML =
      'Gagal mengambil foto';

    return;
  }

  status.innerHTML =
    `${data.length} foto ditemukan`;
  currentImages = data.map(file =>
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`
);
const selector =
document.getElementById('photoSelector');

if(currentMode !== 'original'){

  selector.style.display = 'block';
generateSlotSelector();
  
}else{

  selector.style.display = 'none';

}
  data.forEach((file,index) => {

    const imageUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`;
    const originalUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`;

    let finalImage = imageUrl;

if(currentMode === 'original'){

  gallery.innerHTML += `

  <div class="photo-card">

    <img
      src="${imageUrl}"
      loading="lazy"
      onclick="previewPhoto('${originalUrl}')"
    >

  </div>

  `;

}else{

  let slotsHTML = '';

for(let i=1; i<=currentTemplateData.total_slot; i++){

  slotsHTML += `

  <img
  src="${
    currentImages[
      document.getElementById(`slot${i}`)?.value || 0
    ]
  }"
  class="slot"
  style="
  top:${currentTemplateData[`slot${i}_top`]}px;
  left:${currentTemplateData[`slot${i}_left`]}px;
  width:${currentTemplateData[`slot${i}_width`]}px;
  height:${currentTemplateData[`slot${i}_height`]}px;
  "
  >

  `;

}

gallery.innerHTML = `

<div class="photostrip">

${slotsHTML}

<img
src="${currentTemplate}"
class="photostrip-template"
>

</div>

`;
  return;

}

});

}
function previewPhoto(url){
  currentIndex =
    currentImages.indexOf(url);

  showPreview();

}

function showPreview(){

  document.getElementById('previewModal')
    .style.display = 'flex';

  const img =
    document.getElementById('previewImage');

  img.style.transform =
    'scale(1) translate(0px,0px)';

  img.onload = () => {

    if(panzoomInstance){
      panzoomInstance.destroy();
    }

    panzoomInstance = Panzoom(img, {
      maxScale:5,
      minScale:1,
      startScale:1,
      startX:0,
      startY:0,
      contain:'automatic',
      cursor:'grab',
      step:0.15
    });

    img.parentElement.addEventListener(
      'wheel',
      panzoomInstance.zoomWithWheel
    );

  };

  img.src = currentImages[currentIndex];

}

function nextPhoto(){

  currentIndex++;

  if(currentIndex >= currentImages.length){
    currentIndex = 0;
  }

  showPreview();

}

function prevPhoto(){
  

  currentIndex--;

  if(currentIndex < 0){
    currentIndex =
      currentImages.length - 1;
  }

  showPreview();

}

function togglePhoto(checkbox){

  if(checkbox.checked){

    selectedPhotos.push(
      checkbox.value
    );

  }else{

    selectedPhotos =
      selectedPhotos.filter(
        item => item !== checkbox.value
      );

  }

  if(selectedPhotos.length > 0){

    document.getElementById('printBtn')
      .style.display = 'block';

  }else{

    document.getElementById('printBtn')
      .style.display = 'none';

  }

}

let panzoomInstance;
let currentImages = [];
let currentIndex = 0;

document.addEventListener('keydown', e => {

  const modal =
    document.getElementById('previewModal');

  if(modal.style.display !== 'flex')
    return;

  if(e.key === 'ArrowRight'){
    nextPhoto();
  }

  if(e.key === 'ArrowLeft'){
    prevPhoto();
  }

  if(e.key === 'Escape'){
    closePreview();
  }

});
let touchStartX = 0;
let touchEndX = 0;

const previewModal =
document.getElementById('previewModal');

previewModal.addEventListener(
'touchstart',
e => {

  touchStartX =
    e.changedTouches[0].screenX;

});

previewModal.addEventListener(
'touchend',
e => {

  touchEndX =
    e.changedTouches[0].screenX;

  handleSwipe();

});

function handleSwipe(){

  const swipeDistance =
    touchEndX - touchStartX;

  if(swipeDistance < -50){
    nextPhoto();
  }

  if(swipeDistance > 50){
    prevPhoto();
  }

}
function closePreview(){

  document.getElementById('previewModal')
    .style.display = 'none';

  if(panzoomInstance){
    panzoomInstance.destroy();
  }

}

function sendPrintRequest(){

  const pesan =
`Halo Admin 👋

Saya ingin cetak foto berikut:

Kode Booking:
${currentKodeBooking}

Foto dipilih:
${selectedPhotos.join('\n')}

Terima kasih`;

  const nomorAdmin =
'6285655194918';

  window.open(
`https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`,
'_blank'
);

}
function searchAlbum(){

  const kode =
    document.getElementById('searchKode')
    .value
    .trim();

  if(!kode){

    alert('Masukkan kode booking');

    return;
  }

  openAlbum(kode);

}
  document
.getElementById('searchKode')

.addEventListener('keypress', function(e){

  if(e.key === 'Enter'){

    searchAlbum();

  }

});
  async function loadTemplates(){

  const { data, error } =
    await supabaseClient
    .from('template')
    .select('*')
    .order('id',{ ascending:true });

    allTemplates = data;
  if(error){

    console.log(error);

    return;
  }

  const container =
    document.getElementById('templateContainer');

  container.innerHTML = '';

  // tombol original
  container.innerHTML += `

<div
class="template-btn"
onclick="
setMode(
'original',
''
)
"
>

<div style="
height:180px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:bold;
">
Original
</div>

<p>Tanpa Frame</p>

</div>

`;

  // template dari database
  data.forEach(item => {

    container.innerHTML += `

<div
class="template-btn"
onclick="
setMode(
'template',
'${item.gambar}',
${item.id}
)
"
>

<img src="${item.gambar}">

<p>${item.nama}</p>

</div>

`;

  });

}
  function generateSlotSelector(){

  const container =
    document.getElementById('slotSelector');

  container.innerHTML = '';

  let totalSlot = 4;

  if(currentTemplateData?.total_slot){

    totalSlot =
      currentTemplateData.total_slot;

  }

  for(let i=1; i<=totalSlot; i++){

    let options = '';

    currentImages.forEach((img,index)=>{

      options += `
      <option value="${index}">
        Foto ${index+1}
      </option>
      `;

    });

    container.innerHTML += `

    <select
    id="slot${i}"
    onchange="
updatePhotostrip()
"
    style="
    width:100%;
    margin-bottom:12px;
    padding:8px;
    border-radius:10px;
    "
    >

    ${options}

    </select>

    `;

  }

}
  function updatePhotostrip(){

  let slotsHTML = '';

  for(let i=1; i<=currentTemplateData.total_slot; i++){

    const selectedIndex =
      document.getElementById(`slot${i}`).value;

    slotsHTML += `

    <img
    src="${currentImages[selectedIndex]}"
    class="slot"
    style="
    top:${currentTemplateData[`slot${i}_top`]}px;
    left:${currentTemplateData[`slot${i}_left`]}px;
    width:${currentTemplateData[`slot${i}_width`]}px;
    height:${currentTemplateData[`slot${i}_height`]}px;
    "
    >

    `;

  }

  document.getElementById('gallery').innerHTML = `

  <div class="photostrip">

  ${slotsHTML}

  <img
  src="${currentTemplate}"
  class="photostrip-template"
  >

  </div>

  `;

}
  function setMode(
mode,
template='',
templateId=null
){

  currentMode = mode;

  currentTemplate = template;

  if(mode === 'original'){

    currentTemplateData = null;

  }else{

    currentTemplateData =
      allTemplates.find(
        item => item.id == templateId
      );

  }

  generateSlotSelector();

if(currentKodeBooking){

  openAlbum(currentKodeBooking);

  if(mode !== 'original'){
    updatePhotostrip();
  }

}
    }
</script>

<div
id="previewModal"
onclick="closePreview()"
>
  <button
class="nav-btn left"
onclick="event.stopPropagation();prevPhoto()"
>
❮
</button>

<button
class="nav-btn right"
onclick="event.stopPropagation();nextPhoto()"
>
❯
</button>

<span onclick="closePreview()">
✕
</span>

<img
id="previewImage"
onclick="event.stopPropagation()"
>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>
</body>
</html>
