<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hasil Foto Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  box-sizing:border-box;
  min-height:100vh;
  overflow-x:hidden;
}
  *{
  scroll-behavior:smooth;
}
  *{
  scrollbar-width:none;
}

::-webkit-scrollbar{
  display:none;
}

.container{
  max-width:1400px;
  margin:auto;
  padding-bottom:100px;
}

h1{
  text-align:center;
  margin-bottom:35px;
  font-size:42px;
  font-weight:800;
  letter-spacing:1px;
}

.album-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.album-card{
  background:#1e1e1e;
  border-radius:20px;
  padding:25px;
  cursor:pointer;
  transition:0.2s;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

.album-card:hover{
  transform:translateY(-5px);
  background:#25D366;
}
.album-card h3{
  margin:0;
  font-size:20px;
}

.album-card:hover h3{
  color:white;
}
.album-icon{
  font-size:50px;
  margin-bottom:15px;
}

.album-card:hover{
  box-shadow:0 10px 30px rgba(37,211,102,0.25);
}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:24px;
  padding-bottom:120px;
  align-items:start;
}

.photo-card img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  display:block;
  transition:0.3s;
  border-bottom:1px solid rgba(255,255,255,0.05);
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
  will-change:transform;
}

  .photo-card{
  background:#181818;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  transition:0.25s;
  display:flex;
  flex-direction:column;
  border:1px solid rgba(255,255,255,0.04);
  backdrop-filter:blur(10px);
}
  .photo-info{
  padding:18px;
  background:#181818;
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:auto;
}

.photo-card::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.25),
    transparent
  );
  opacity:0;
  transition:0.25s;
  pointer-events:none;
}

.photo-card:hover::after{
  opacity:1;
}
.photo-card:hover img{
  transform:scale(1.03);
}
 
.photo-card:hover{
  transform:translateY(-5px);
  box-shadow:
0 10px 30px rgba(0,0,0,0.35),
0 0 0 1px rgba(37,211,102,0.08);
}

.photo-info label{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.download-btn{
  width:100%;
  background:#25D366;
  border:none;
  color:white;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:0.2s;
}

.download-btn:hover{
  opacity:0.9;
  transform:translateY(-2px);
}
.download-btn:active{
  transform:scale(0.98);
}
#status{
  text-align:center;
  margin-bottom:20px;
  opacity:0.8;
}

#printBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#25D366;
  color:white;
  border:none;
  padding:16px 24px;
  border-radius:50px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:none;
  box-shadow:0 10px 30px rgba(37,211,102,0.35);
  transition:0.2s;
}

#printBtn:hover{
  transform:translateY(-3px);
}

.back-btn{
  margin-bottom:30px;
  background:#25D366;
  border:none;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  cursor:pointer;
  display:none;
  font-size:15px;
  font-weight:600;
  transition:0.2s;
}

.back-btn:hover{
  transform:translateY(-2px);
}
#previewModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
  box-sizing:border-box;
}

#previewModal img{
  width:auto;
  height:auto;
  max-width:90vw;
  max-height:90vh;
  display:block;
  margin:auto;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  object-fit:contain;
  animation:zoomPreview 0.2s ease;
  cursor:grab;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
}
  @keyframes zoomPreview{
  from{
    transform:scale(0.95);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}
#previewModal{
  animation:fadePreview 0.2s ease;
}

@keyframes fadePreview{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}
#previewModal span{
  position:absolute;
  top:20px;
  right:25px;
  font-size:35px;
  color:white;
  cursor:pointer;
  transition:0.2s;
}
  #previewModal span:hover{
  transform:scale(1.1);
  opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<h1>Hasil Foto Studio</h1>

<div id="albumList" class="album-grid"></div>

<button
class="back-btn"
id="backBtn"
onclick="backToAlbums()"
>
  ← Kembali ke Album
</button>

<div id="status"></div>

<div class="gallery" id="gallery"></div>

</div>

<button id="printBtn" onclick="sendPrintRequest()">
  Pesan Cetak
</button>

<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

let selectedPhotos = [];
let currentKodeBooking = '';

loadAlbums();

async function loadAlbums(){

  const albumList =
    document.getElementById('albumList');

  const status =
    document.getElementById('status');

  status.innerHTML =
  '📁 Mengambil album...';

  const { data, error } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list('', {
        limit:100
      });

  if(error){

    console.log(error);

    status.innerHTML =
      'Gagal mengambil album';

    return;
  }

  status.innerHTML = '';

  albumList.innerHTML = '';

  data.forEach(folder => {

    if(folder.id === null){

      albumList.innerHTML += `

<div
class="album-card"
onclick="openAlbum('${folder.name}')"
>

<div class="album-icon">
📁
</div>

<h3>${folder.name}</h3>

</div>

      `;

    }

  });

}

async function openAlbum(kodeBooking){

  currentKodeBooking = kodeBooking;

  selectedPhotos = [];

  document.getElementById('albumList')
    .style.display = 'none';

  document.getElementById('backBtn')
    .style.display = 'inline-block';

  const gallery =
    document.getElementById('gallery');

  const status =
    document.getElementById('status');

  gallery.innerHTML = '';

  status.innerHTML =
  '📸 Mengambil foto...';

  const { data, error } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list(kodeBooking);

  if(error){

    console.log(error);

    status.innerHTML =
      'Gagal mengambil foto';

    return;
  }

  status.innerHTML =
    `${data.length} foto ditemukan`;

  data.forEach((file,index) => {

    const imageUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`;
    const originalUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`;

    gallery.innerHTML += `

<div class="photo-card">

<img
src="${imageUrl}"
loading="lazy"
onclick="previewPhoto('${originalUrl}')"
>

<div class="photo-info">

<label>

<input
type="checkbox"
value="${file.name}"
onchange="togglePhoto(this)"
>

Foto ${index + 1}

</label>

</div>

</div>

    `;

  });

}

function backToAlbums(){

  document.getElementById('albumList')
    .style.display = 'grid';

  document.getElementById('gallery')
    .innerHTML = '';

  document.getElementById('status')
    .innerHTML = '';

  document.getElementById('backBtn')
    .style.display = 'none';

  document.getElementById('printBtn')
    .style.display = 'none';

}

function togglePhoto(checkbox){

  if(checkbox.checked){

    selectedPhotos.push(
      checkbox.value
    );

  }else{

    selectedPhotos =
      selectedPhotos.filter(
        item => item !== checkbox.value
      );

  }

  if(selectedPhotos.length > 0){

    document.getElementById('printBtn')
      .style.display = 'block';

  }else{

    document.getElementById('printBtn')
      .style.display = 'none';

  }

}

let panzoomInstance;

function previewPhoto(url){

  document.getElementById('previewModal')
    .style.display = 'flex';

  const img =
    document.getElementById('previewImage');

  img.style.transform = 'scale(1) translate(0px,0px)';

  img.onload = () => {

    if(panzoomInstance){
      panzoomInstance.destroy();
    }

    panzoomInstance = Panzoom(img, {
      maxScale:5,
      minScale:1,
      startScale:1,
      startX:0,
      startY:0,
      contain:'automatic',
      cursor:'grab',
      step:0.15
    });

    img.parentElement.addEventListener(
      'wheel',
      panzoomInstance.zoomWithWheel
    );

    panzoomInstance.zoom(1, {
      animate:false
    });

    panzoomInstance.pan(0,0, {
      animate:false
    });

  };

  img.src = url;

}

function closePreview(){

  document.getElementById('previewModal')
    .style.display = 'none';

  if(panzoomInstance){
    panzoomInstance.destroy();
  }

}

function sendPrintRequest(){

  const pesan =
`Halo Admin 👋

Saya ingin cetak foto berikut:

Kode Booking:
${currentKodeBooking}

Foto dipilih:
${selectedPhotos.join('\n')}

Terima kasih`;

  const nomorAdmin =
'6285655194918';

  window.open(
`https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`,
'_blank'
);

}

</script>
<div
id="previewModal"
onclick="closePreview()"
>

<span onclick="closePreview()">
✕
</span>

<img
id="previewImage"
onclick="event.stopPropagation()"
>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>
</body>
</html>
