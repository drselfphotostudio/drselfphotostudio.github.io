<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hasil Foto Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  box-sizing:border-box;
}
  body{
  min-height:100vh;
}
  *{
  scrollbar-width:none;
}

::-webkit-scrollbar{
  display:none;
}

.container{
  max-width:1400px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:35px;
  font-size:42px;
  font-weight:800;
  letter-spacing:1px;
}

.album-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.album-card{
  background:#1e1e1e;
  border-radius:20px;
  padding:25px;
  cursor:pointer;
  transition:0.2s;
  text-align:center;
}

.album-card:hover{
  transform:translateY(-5px);
  background:#25D366;
}
.album-card h3{
  margin:0;
  font-size:20px;
}

.album-card:hover h3{
  color:white;
}
.album-icon{
  font-size:50px;
  margin-bottom:15px;
}
.album-card{
  box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

.album-card:hover{
  box-shadow:0 10px 30px rgba(37,211,102,0.25);
}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
  align-items:start;
}
.gallery{
  padding-bottom:120px;
}
.photo-card{
  background:#1e1e1e;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  height:100%;
}

.photo-card img{
  width:100%;
  height:350px;
  object-fit:cover;
  display:block;
}
  .photo-card img{
  transition:0.3s;
}

.photo-card:hover img{
  transform:scale(1.03);
}
  .photo-card{
  transition:0.25s;
}

.photo-card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.photo-info{
  padding:15px;
  margin-top:auto;
}

.photo-info label{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.download-btn{
  width:100%;
  background:#25D366;
  border:none;
  color:white;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:0.2s;
}

.download-btn:hover{
  opacity:0.9;
  transform:translateY(-2px);
}

#status{
  text-align:center;
  margin-bottom:20px;
  opacity:0.8;
}

#printBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#25D366;
  color:white;
  border:none;
  padding:16px 24px;
  border-radius:50px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:none;
  box-shadow:0 10px 30px rgba(37,211,102,0.35);
  transition:0.2s;
}

#printBtn:hover{
  transform:translateY(-3px);
}

.back-btn{
  margin-bottom:30px;
  background:#25D366;
  border:none;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  cursor:pointer;
  display:none;
  font-size:15px;
  font-weight:600;
  transition:0.2s;
}

.back-btn:hover{
  transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="container">

<h1>Hasil Foto Studio</h1>

<div id="albumList" class="album-grid"></div>

<button
class="back-btn"
id="backBtn"
onclick="backToAlbums()"
>
  ← Kembali ke Album
</button>

<div id="status"></div>

<div class="gallery" id="gallery"></div>

</div>

<button id="printBtn" onclick="sendPrintRequest()">
  Pesan Cetak
</button>

<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

let selectedPhotos = [];
let currentKodeBooking = '';

loadAlbums();

async function loadAlbums(){

  const albumList =
    document.getElementById('albumList');

  const status =
    document.getElementById('status');

  status.innerHTML =
  '📁 Mengambil album...';

  const { data, error } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list('', {
        limit:100
      });

  if(error){

    console.log(error);

    status.innerHTML =
      'Gagal mengambil album';

    return;
  }

  status.innerHTML = '';

  albumList.innerHTML = '';

  data.forEach(folder => {

    if(folder.id === null){

      albumList.innerHTML += `

<div
class="album-card"
onclick="openAlbum('${folder.name}')"
>

<div class="album-icon">
📁
</div>

<h3>${folder.name}</h3>

</div>

      `;

    }

  });

}

async function openAlbum(kodeBooking){

  currentKodeBooking = kodeBooking;

  selectedPhotos = [];

  document.getElementById('albumList')
    .style.display = 'none';

  document.getElementById('backBtn')
    .style.display = 'inline-block';

  const gallery =
    document.getElementById('gallery');

  const status =
    document.getElementById('status');

  gallery.innerHTML = '';

  status.innerHTML =
  '📸 Mengambil foto...';

  const { data, error } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list(kodeBooking);

  if(error){

    console.log(error);

    status.innerHTML =
      'Gagal mengambil foto';

    return;
  }

  status.innerHTML =
    `${data.length} foto ditemukan`;

  data.forEach(file => {

    const imageUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`;

    gallery.innerHTML += `

<div class="photo-card">

<img src="${imageUrl}">

<div class="photo-info">

<label>

<input
type="checkbox"
value="${file.name}"
onchange="togglePhoto(this)"
>

Pilih untuk cetak

</label>

<button
class="download-btn"
onclick="downloadPhoto('${imageUrl}')"
>
Download
</button>

</div>

</div>

    `;

  });

}

function backToAlbums(){

  document.getElementById('albumList')
    .style.display = 'grid';

  document.getElementById('gallery')
    .innerHTML = '';

  document.getElementById('status')
    .innerHTML = '';

  document.getElementById('backBtn')
    .style.display = 'none';

  document.getElementById('printBtn')
    .style.display = 'none';

}

function togglePhoto(checkbox){

  if(checkbox.checked){

    selectedPhotos.push(
      checkbox.value
    );

  }else{

    selectedPhotos =
      selectedPhotos.filter(
        item => item !== checkbox.value
      );

  }

  if(selectedPhotos.length > 0){

    document.getElementById('printBtn')
      .style.display = 'block';

  }else{

    document.getElementById('printBtn')
      .style.display = 'none';

  }

}

function downloadPhoto(url){

  window.open(url, '_blank');

}

function sendPrintRequest(){

  const pesan =
`Halo Admin 👋

Saya ingin cetak foto berikut:

Kode Booking:
${currentKodeBooking}

Foto dipilih:
${selectedPhotos.join('\n')}

Terima kasih`;

  const nomorAdmin =
'6285655194918';

  window.open(
`https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`,
'_blank'
);

}

</script>

</body>
</html>
