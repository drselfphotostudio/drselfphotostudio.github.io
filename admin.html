<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:'Poppins',sans-serif;
  padding:30px;
}

h1{
  margin-bottom:30px;
}

.table-wrapper{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#1a1a1a;
  border-radius:15px;
  overflow:hidden;
}

th,td{
  padding:15px;
  border-bottom:1px solid #333;
  text-align:left;
}

th{
  background:#25D366;
}

.status{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

.pending{
  background:orange;
  color:black;
}

.paid{
  background:#25D366;
  color:white;
}

button{
  background:#25D366;
  border:none;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}
  .login-box{
  max-width:400px;
  margin:100px auto;
  background:#1a1a1a;
  padding:40px;
  border-radius:25px;
  box-sizing:border-box;
}

.login-box h2{
  text-align:center;
  margin-bottom:30px;
}

.login-input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  box-sizing:border-box;
  font-size:16px;
}

.login-btn{
  width:100%;
  margin-top:20px;
  box-sizing:border-box;
  font-size:16px;
}

</style>
</head>

<body onload="checkLogin()">
<div id="loginPage">

  <div class="login-box">

    <h2>Login Admin</h2>

    <input
  type="password"
  id="adminPassword"
  placeholder="Masukkan Password"
  class="login-input"
  onkeypress="handleEnter(event)"
>
<div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
  
  <input
    type="checkbox"
    id="showPassword"
    onclick="togglePassword()"
  >

  <label for="showPassword">
    Lihat Password
  </label>

</div>
    <button
  onclick="loginAdmin()"
  class="login-btn"
>
      Login
    </button>

  </div>

</div>

<div id="adminContent" style="display:none;">
<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
">

<h1>Admin Dashboard Booking</h1>

<button onclick="logoutAdmin()">
  Logout
</button>

</div>

<div class="table-wrapper">

<table>

<thead>
<tr>
  <th>Kode</th>
  <th>Nama</th>
  <th>WhatsApp</th>
  <th>Tanggal</th>
  <th>Jam</th>
  <th>Paket</th>
<th>Harga</th>
<th>Status</th>
<th>Upload Foto</th>
<th>Kirim WA</th>
</tr>
</thead>

<tbody id="bookingTable">
</tbody>

</table>

</div>
</div>
<script>

const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
);
const paketHarga = {
  Basic: 'Rp 10.000',
  Standard: 'Rp 20.000',
  Premium: 'Rp 30.000'
};
async function loadBookings(){

  const { data, error } = await supabaseClient
    .from('bookings')
    .select('*')
    .order('id', { ascending:false });

  console.log(data);

  const table = document.getElementById('bookingTable');

  table.innerHTML = '';

  data.forEach(item => {

    table.innerHTML += `

      <tr>

        <td>${item.kode_booking}</td>

        <td>${item.nama}</td>

        <td>${item.no_wa}</td>

        <td>${item.tanggal}</td>

        <td>${item.jam}</td>

        <td>${item.paket}</td>

<td>
  ${paketHarga[item.paket] || '-'}
</td>
<td>

  <span class="status ${item.payment_status}">
    ${item.payment_status}
  </span>

  <br><br>

  ${item.payment_status !== 'paid' ? `

<button onclick="approvePayment(${item.id})">
  Approve
</button>

` : `

<span style="color:#25D366;font-size:14px;">
  Pembayaran sudah diapprove
</span>

`}

</td>

<td>

${item.payment_status !== 'paid' ? `
  
  <span style="color:orange;">
    Menunggu approve pembayaran
  </span>

` : `

  <input
  type="file"
  id="file-${item.id}"
  accept="image/*"
  capture="environment"
  multiple
  onchange="uploadPhoto('${item.kode_booking}', ${item.id})"
>

    <div id="upload-status-${item.id}" style="margin-top:10px;font-size:14px;opacity:0.8;">
    Mengecek foto...
  </div>

`}

</td>

<td>

  <button onclick="sendWhatsapp('${item.kode_booking}','${item.no_wa}')">
    Kirim WA
  </button>

</td>

</tr>

    `;
if(item.payment_status === 'paid'){

  checkUploadedPhotos(
    item.kode_booking,
    item.id
  );

}
  });

}

loadBookings();
  // realtime booking baru / update otomatis
supabaseClient
  .channel('booking-realtime')

  .on(
    'postgres_changes',
    {
      event: '*',
      schema: 'public',
      table: 'bookings'
    },

    payload => {

      console.log('Realtime update:', payload);

      loadBookings();

    }
  )

  .subscribe();
  async function uploadPhoto(kodeBooking, id){

  const fileInput =
    document.getElementById(`file-${id}`);

  const files = fileInput.files;

  if(files.length === 0){

    alert('Pilih foto dulu');

    return;
  }

  const { data: existingFiles } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list(kodeBooking);

  const existingNames =
    existingFiles?.map(file => file.name) || [];

  for(let file of files){

    if(existingNames.includes(file.name)){

      alert(`Foto ${file.name} sudah pernah diupload`);

      continue;
    }

    const { error } = await supabaseClient
      .storage
      .from('customer-photo')
      .upload(
        `${kodeBooking}/${file.name}`,
        file
      );

    if(error){

      console.log(error);

      alert('Upload gagal');

      return;
    }

  }

  alert('Foto berhasil diupload');

  checkUploadedPhotos(kodeBooking, id);

}
  async function approvePayment(id){

  const confirmApprove =
    confirm('Approve pembayaran customer ini?');

  if(!confirmApprove) return;

  const { error } = await supabaseClient
    .from('bookings')
    .update({
      payment_status:'paid'
    })
    .eq('id', id);

  if(error){

    alert('Gagal approve');

    console.log(error);

    return;
  }

  alert('Pembayaran berhasil diapprove');

}

function sendWhatsapp(kodeBooking, nomor){

  nomor = nomor.replace(/^0/, '62');

  const pesan =
`Halo Kak 👋

Foto self photo studio sudah selesai 😊

Silakan download melalui link berikut:

https://drselfphotostudio.github.io/download.html?id=${kodeBooking}

Terima kasih 🙏`;

  const url =
`https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`;

  window.open(url, '_blank');

}
async function checkUploadedPhotos(kodeBooking, id){

  const { data, error } = await supabaseClient
    .storage
    .from('customer-photo')
    .list(kodeBooking);

  const statusDiv =
    document.getElementById(`upload-status-${id}`);

  if(!statusDiv) return;

  if(error || !data){

    statusDiv.innerHTML =
      'Belum ada foto';

    return;
  }

  if(data.length > 0){

    statusDiv.innerHTML =
      `✅ ${data.length} foto sudah diupload`;

  }else{

    statusDiv.innerHTML =
      'Belum ada foto';

  }

}
  function loginAdmin(){

  const password =
    document.getElementById('adminPassword').value;

  if(password === 'drstudio123'){

    localStorage.setItem(
      'admin_login',
      'true'
    );

    checkLogin();

  }else{

    alert('Password salah');

  }

}

function checkLogin(){

  const isLogin =
    localStorage.getItem('admin_login');

  if(isLogin === 'true'){

    document.getElementById('loginPage')
      .style.display = 'none';

    document.getElementById('adminContent')
      .style.display = 'block';

  }else{

    document.getElementById('loginPage')
      .style.display = 'block';

    document.getElementById('adminContent')
      .style.display = 'none';

  }

}

function logoutAdmin(){

  localStorage.removeItem('admin_login');

  location.reload();

}
  function togglePassword(){

  const input =
    document.getElementById('adminPassword');

  if(input.type === 'password'){

    input.type = 'text';

  }else{

    input.type = 'password';

  }

}

function handleEnter(event){

  if(event.key === 'Enter'){

    loginAdmin();

  }

}
</script>

</body>
</html>
