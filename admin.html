<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:'Poppins',sans-serif;
  padding:30px;
}

h1{
  margin:0;
  font-size:52px;
  line-height:1.1;
}

.table-wrapper{
  overflow:auto;
}
.header-card{
  background:#1a1a1a;
  padding:30px;
  border-radius:28px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:rgba(26,26,26,0.95);
  border-radius:24px;
  overflow:hidden;
  min-width:1200px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  backdrop-filter:blur(10px);
}

th,td{
  padding:20px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  text-align:left;
  vertical-align:middle;
}

th{
  background:#25D366;
}
tbody tr{
  transition:0.2s;
}

tbody tr:hover{
  background:rgba(255,255,255,0.03);
}
  input[type="text"],
input[type="password"],
input[type="file"]{
  background:#111;
  color:white;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.2s;
}

input[type="text"]:focus,
input[type="password"]:focus{
  outline:none;
  border-color:#25D366;
  box-shadow:0 0 0 4px rgba(37,211,102,0.15);
}
.status{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

.pending{
  background:orange;
  color:black;
}

.paid{
  background:#25D366;
  color:white;
}

button{
  background:#25D366;
  border:none;
  color:white;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);
  opacity:0.9;
}
  .btn-lihat{
  display:inline-block;
  padding:10px 15px;
  background:#25D366;
  color:white;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
}

.btn-lihat:hover{
  opacity:0.8;
}
  .login-box{
  max-width:400px;
  margin:100px auto;
  background:#1a1a1a;
  padding:40px;
  border-radius:25px;
  box-sizing:border-box;
}

.login-box h2{
  text-align:center;
  margin-bottom:30px;
}

.login-input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  box-sizing:border-box;
  font-size:16px;
}

.login-btn{
  width:100%;
  margin-top:20px;
  box-sizing:border-box;
  font-size:16px;
}

  .sidebar{
  position:fixed;
  top:0;
  left:0;
  width:260px;
  height:100vh;
  background:#151515;
  border-right:1px solid rgba(255,255,255,0.06);
  padding:30px 20px;
  box-sizing:border-box;
  z-index:999;
}

.sidebar h2{
  margin:0 0 35px;
  font-size:32px;
}

.sidebar button{
  width:100%;
  margin-bottom:14px;
  background:#1f1f1f;
  padding:16px;
  border-radius:14px;
  text-align:left;
  font-size:16px;
}

.sidebar button:hover{
  background:#25D366;
}

.main-content{
  margin-left:280px;
}

.section-card{
  background:#1a1a1a;
  padding:25px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
  
@media(max-width:900px){

  body{
    padding:15px;
  }

  h1{
    font-size:34px;
  }

  #adminContent > div:first-child{
    grid-template-columns:1fr;
  }

  table{
    min-width:1000px;
  }

}
</style>
</head>

<body onload="checkLogin()">

<div
class="sidebar"
id="sidebar"
style="display:none;"
>

<h2>📸 Admin</h2>

<button onclick="showSection('booking')">
📋 Customer Booking
</button>

<a
  href="gallery.html"
  style="
    display:block;
    width:100%;
    margin-bottom:14px;
    background:#1f1f1f;
    padding:16px;
    border-radius:14px;
    text-align:left;
    font-size:16px;
    color:white;
    text-decoration:none;
    font-weight:600;
    box-sizing:border-box;
  "
>
🖼️ Galeri Website
</a>

<a
  href="packages.html"
  style="
    display:block;
    width:100%;
    margin-bottom:14px;
    background:#1f1f1f;
    padding:16px;
    border-radius:14px;
    text-align:left;
    font-size:16px;
    color:white;
    text-decoration:none;
    font-weight:600;
    box-sizing:border-box;
  "
>
💰 Paket Harga
</a>

<a
  href="template.html"
  style="
    display:block;
    width:100%;
    margin-bottom:14px;
    background:#1f1f1f;
    padding:16px;
    border-radius:14px;
    text-align:left;
    font-size:16px;
    color:white;
    text-decoration:none;
    font-weight:600;
    box-sizing:border-box;
  "
>
🎞️ Template Photostrip
</a>

<button onclick="logoutAdmin()">
🚪 Logout
</button>

</div>

<div class="main-content">
<div id="loginPage">

  <div class="login-box">

    <h2>Login Admin</h2>

    <input
  type="password"
  id="adminPassword"
  placeholder="Masukkan Password"
  class="login-input"
  onkeypress="handleEnter(event)"
>
<div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
  
  <input
    type="checkbox"
    id="showPassword"
    onclick="togglePassword()"
  >

  <label for="showPassword">
    Lihat Password
  </label>

</div>
    <button
  onclick="loginAdmin()"
  class="login-btn"
>
      Login
    </button>

  </div>

</div>

<div id="adminContent" style="display:none;">
  <div style="
display:grid;
grid-template-columns:1fr;
gap:25px;
margin-bottom:35px;
">

<div class="header-card">

<h1 id="pageTitle">
Customer Booking
</h1>

<p id="pageDesc">
Kelola booking customer, upload foto, dan kirim hasil.
</p>

</div>

<div
id="booking-section"
class="content-section"
>
<div class="table-wrapper">

<table>
  
<thead>
<tr>
  <th>Kode</th>
  <th>Nama</th>
  <th>WhatsApp</th>
  <th>Tanggal</th>
  <th>Jam</th>
  <th>Paket</th>
<th>Harga</th>
<th>Status</th>
<th>Upload Foto</th>
<th>Lihat Hasil</th>
<th>Kirim WA</th>
</tr>
</thead>

<tbody id="bookingTable">
</tbody>

</table>

</div>

</div>

<script>

const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
);
const paketHarga = {
  Basic: 'Rp 10.000',
  Standard: 'Rp 20.000',
  Premium: 'Rp 30.000'
};
async function loadBookings(){

  const { data, error } = await supabaseClient
    .from('bookings')
    .select('*')
    .order('id', { ascending:false });

  console.log(data);

  const table = document.getElementById('bookingTable');

  table.innerHTML = '';

  data.forEach(item => {

    table.innerHTML += `

      <tr>

        <td>${item.kode_booking}</td>

        <td>${item.nama}</td>

        <td>${item.no_wa}</td>

        <td>${item.tanggal}</td>

        <td>${item.jam}</td>

        <td>${item.paket}</td>

<td>
  ${paketHarga[item.paket] || '-'}
</td>
<td>

  <span class="status ${item.payment_status}">
    ${item.payment_status}
  </span>

  <br><br>

  ${item.payment_status !== 'paid' ? `

<button onclick="approvePayment(${item.id})">
  Approve
</button>

` : `

<span style="color:#25D366;font-size:14px;">
  Pembayaran sudah diapprove
</span>

`}

</td>

<td>

${item.payment_status !== 'paid' ? `
  
  <span style="color:orange;">
    Menunggu approve pembayaran
  </span>

` : `

  <input
  type="file"
  id="file-${item.id}"
  accept="image/*"
  multiple
  onchange="uploadPhoto('${item.kode_booking}', ${item.id})"
>

    <div id="upload-status-${item.id}" style="margin-top:10px;font-size:14px;opacity:0.8;">
    Mengecek foto...
  </div>

`}

</td>

<td>

  <a
    href="hasil.html?kode=${item.kode_booking}"
    target="_blank"
    class="btn-lihat"
  >
    Lihat
  </a>

</td>

<td>

  <button onclick="sendWhatsapp('${item.kode_booking}','${item.no_wa}')">
    Kirim WA
  </button>

</td>

</tr>

    `;
if(item.payment_status === 'paid'){

  checkUploadedPhotos(
    item.kode_booking,
    item.id
  );

}
  });

}

loadBookings();
  // realtime booking baru / update otomatis
supabaseClient
  .channel('booking-realtime')

  .on(
    'postgres_changes',
    {
      event: '*',
      schema: 'public',
      table: 'bookings'
    },

    payload => {

      console.log('Realtime update:', payload);

      loadBookings();

    }
  )

  .subscribe();
  async function uploadPhoto(kodeBooking, id){

  const fileInput =
    document.getElementById(`file-${id}`);

  const files = fileInput.files;

  if(files.length === 0){

    alert('Pilih foto dulu');

    return;
  }

  const { data: existingFiles } =
    await supabaseClient
      .storage
      .from('customer-photo')
      .list(kodeBooking);

  const existingNames =
    existingFiles?.map(file => file.name) || [];

  for(let file of files){

    if(existingNames.includes(file.name)){

      alert(`Foto ${file.name} sudah pernah diupload`);

      continue;
    }

    const { error } = await supabaseClient
      .storage
      .from('customer-photo')
      .upload(
        `${kodeBooking}/${file.name}`,
        file
      );

    if(error){

      console.log(error);

      alert('Upload gagal');

      return;
    }

  }

  alert('Foto berhasil diupload');

  checkUploadedPhotos(kodeBooking, id);

}
  async function approvePayment(id){

  const confirmApprove =
    confirm('Approve pembayaran customer ini?');

  if(!confirmApprove) return;

  const { error } = await supabaseClient
    .from('bookings')
    .update({
      payment_status:'paid'
    })
    .eq('id', id);

  if(error){

    alert('Gagal approve');

    console.log(error);

    return;
  }

  alert('Pembayaran berhasil diapprove');

}

function sendWhatsapp(kodeBooking, nomor){

  nomor = nomor.replace(/^0/, '62');

  const pesan =
`Halo Kak 👋

Foto self photo studio sudah selesai 😊

Silakan download melalui link berikut:

https://drselfphotostudio.github.io/download.html?id=${kodeBooking}

Terima kasih 🙏`;

  const url =
`https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`;

  window.open(url, '_blank');

}
async function checkUploadedPhotos(kodeBooking, id){

  const { data, error } = await supabaseClient
    .storage
    .from('customer-photo')
    .list(kodeBooking);

  const statusDiv =
    document.getElementById(`upload-status-${id}`);

  if(!statusDiv) return;

  if(error || !data){

    statusDiv.innerHTML =
      'Belum ada foto';

    return;
  }

  if(data.length > 0){

    statusDiv.innerHTML =
      `✅ ${data.length} foto sudah diupload`;

  }else{

    statusDiv.innerHTML =
      'Belum ada foto';

  }

}
  function loginAdmin(){

  const password =
    document.getElementById('adminPassword').value;

  if(password === 'drstudio123'){

    localStorage.setItem(
      'admin_login',
      'true'
    );

    checkLogin();

  }else{

    alert('Password salah');

  }

}

function checkLogin(){

  const isLogin =
    localStorage.getItem('admin_login');

  if(isLogin === 'true'){

  document.getElementById('loginPage')
    .style.display = 'none';

  document.getElementById('adminContent')
    .style.display = 'block';

  document.getElementById('sidebar')
    .style.display = 'block';

  showSection('booking');
    
  }else{

  document.getElementById('loginPage')
    .style.display = 'block';

  document.getElementById('adminContent')
    .style.display = 'none';

  document.getElementById('sidebar')
    .style.display = 'none';

}

}

  function showSection(section){

  document
    .querySelectorAll('.content-section')
    .forEach(item=>{
      item.style.display = 'none';
    });

  document.getElementById(
    section + '-section'
  ).style.display = 'block';

  const title =
    document.getElementById('pageTitle');

  const desc =
    document.getElementById('pageDesc');

  if(section === 'booking'){

    title.innerText =
      'Customer Booking';

    desc.innerText =
      'Kelola booking customer, upload foto, dan kirim hasil.';

  }

  if(section === 'gallery'){

    title.innerText =
      'Galeri Website';

    desc.innerText =
      'Kelola galeri foto yang tampil di website.';

  }

  if(section === 'paket'){

    title.innerText =
      'Paket Harga';

    desc.innerText =
      'Kelola paket dan harga studio foto.';

  }

}
  
function logoutAdmin(){

  localStorage.removeItem('admin_login');

  location.reload();

}
  function togglePassword(){

  const input =
    document.getElementById('adminPassword');

  if(input.type === 'password'){

    input.type = 'text';

  }else{

    input.type = 'password';

  }

}

function handleEnter(event){

  if(event.key === 'Enter'){

    loginAdmin();

  }

}
  
</script>

</div>

</body>
</html>
