<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:'Poppins',sans-serif;
  padding:30px;
}

h1{
  margin:0;
  font-size:52px;
  line-height:1.1;
}

.table-wrapper{
  overflow:auto;
}
.header-card{
  background:#1a1a1a;
  padding:30px;
  border-radius:28px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:rgba(26,26,26,0.95);
  border-radius:24px;
  overflow:hidden;
  min-width:1200px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  backdrop-filter:blur(10px);
}

th,td{
  padding:20px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  text-align:left;
  vertical-align:middle;
}

th{
  background:#25D366;
}
tbody tr{
  transition:0.2s;
}

tbody tr:hover{
  background:rgba(255,255,255,0.03);
}
  input[type="text"],
input[type="password"],
input[type="file"]{
  background:#111;
  color:white;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.2s;
}

input[type="text"]:focus,
input[type="password"]:focus{
  outline:none;
  border-color:#25D366;
  box-shadow:0 0 0 4px rgba(37,211,102,0.15);
}
.status{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

.pending{
  background:orange;
  color:black;
}

.paid{
  background:#25D366;
  color:white;
}

button{
  background:#25D366;
  border:none;
  color:white;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);
  opacity:0.9;
}
  .btn-lihat{
  display:inline-block;
  padding:10px 15px;
  background:#25D366;
  color:white;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
}

.btn-lihat:hover{
  opacity:0.8;
}
  .login-box{
  max-width:400px;
  margin:100px auto;
  background:#1a1a1a;
  padding:40px;
  border-radius:25px;
  box-sizing:border-box;
}

.login-box h2{
  text-align:center;
  margin-bottom:30px;
}

.login-input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  box-sizing:border-box;
  font-size:16px;
}

.login-btn{
  width:100%;
  margin-top:20px;
  box-sizing:border-box;
  font-size:16px;
}

  .sidebar{
  position:fixed;
  top:0;
  left:0;
  width:260px;
  height:100vh;
  background:#151515;
  border-right:1px solid rgba(255,255,255,0.06);
  padding:30px 20px;
  box-sizing:border-box;
  z-index:999;
}

.sidebar h2{
  margin:0 0 35px;
  font-size:32px;
}

.sidebar button{
  width:100%;
  margin-bottom:14px;
  background:#1f1f1f;
  padding:16px;
  border-radius:14px;
  text-align:left;
  font-size:16px;
}

.sidebar button:hover{
  background:#25D366;
}

.main-content{
  margin-left:280px;
}

.section-card{
  background:#1a1a1a;
  padding:25px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
  
@media(max-width:900px){

  body{
    padding:15px;
  }

  h1{
    font-size:34px;
  }

  #adminContent > div:first-child{
    grid-template-columns:1fr;
  }

  table{
    min-width:1000px;
  }

}
</style>
</head>

</div>

<div class="main-content">
<div id="loginPage">

  <div class="login-box">

    <h2>Login Admin</h2>

    <input
  type="password"
  id="adminPassword"
  placeholder="Masukkan Password"
  class="login-input"
  onkeypress="handleEnter(event)"
>
<div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
  
  <input
    type="checkbox"
    id="showPassword"
    onclick="togglePassword()"
  >

  <label for="showPassword">

  </label>

</div>
    <button
  onclick="loginAdmin()"
  class="login-btn"
>
      Login

<div id="adminContent" style="display:none;">

display:grid;
grid-template-columns:1fr;
gap:25px;
margin-bottom:35px;
">

<div class="header-card">

<h1>
Dashboard Admin
</h1>

<p>
Pilih menu admin yang ingin dikelola.
</p>

<script>

const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

  function loginAdmin(){

  const password =
    document.getElementById('adminPassword').value;

  if(password === 'drstudio123'){

    localStorage.setItem(
      'admin_login',
      'true'
    );

    checkLogin();

  }else{

    alert('Password salah');

  }

}

function checkLogin(){

  const isLogin =
    localStorage.getItem('admin_login');

  if(isLogin === 'true'){

    document.getElementById('loginPage')
      .style.display = 'none';

    document.getElementById('adminContent')
      .style.display = 'block';

    document.getElementById('sidebar')
      .style.display = 'block';

  }else{

    document.getElementById('loginPage')
      .style.display = 'block';

    document.getElementById('adminContent')
      .style.display = 'none';

    document.getElementById('sidebar')
      .style.display = 'none';

  }

}
  
function logoutAdmin(){

  localStorage.removeItem('admin_login');

  location.reload();

}
  function togglePassword(){

  const input =
    document.getElementById('adminPassword');

  if(input.type === 'password'){

    input.type = 'text';

  }else{

    input.type = 'password';

  }

}

function handleEnter(event){

  if(event.key === 'Enter'){

    loginAdmin();

  }

}
  
</script>

</div>
