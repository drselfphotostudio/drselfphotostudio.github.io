<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stop Motion Studio</title>

<script src="
https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
"></script>

<style>

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

h1{
  text-align:center;
  font-size:55px;
  margin-bottom:30px;
}

#preview{
  width:100%;
  max-width:700px;
  height:auto;
  display:block;
  margin:auto;
  border-radius:30px;
  box-shadow:
  0 0 40px rgba(0,0,0,0.7);
}

.controls{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:30px;
  flex-wrap:wrap;
}

button{
  background:#25D366;
  border:none;
  color:white;
  padding:18px 30px;
  border-radius:18px;
  cursor:pointer;
  font-size:22px;
  font-weight:bold;
  transition:0.3s;
  box-shadow:
  0 5px 20px rgba(37,211,102,0.3);
}

button:hover{
  transform:scale(1.05);
}

#speed{
  width:90%;
  max-width:900px;
  display:block;
  margin:40px auto 10px auto;
  accent-color:#25D366;
}

#speedText{
  text-align:center;
  font-size:30px;
  margin-top:15px;
}

.speed-container{
  background:rgba(255,255,255,0.05);
  border-radius:30px;
  padding:30px;
  margin-top:40px;
  backdrop-filter:blur(10px);
}

.back-btn{
  position:absolute;
  top:20px;
  left:20px;
}

@media(max-width:768px){

  h1{
    font-size:35px;
  }

  button{
    font-size:16px;
    padding:14px 22px;
  }

  #speedText{
    font-size:22px;
  }

}

</style>
</head>

<body>

<button
class="ui-control back-btn"
onclick="backToGallery()"
>
← Kembali
</button>

<h1>🎞️ Stop Motion</h1>

<img id="preview">

<div class="controls">

<button
class="ui-control"
id="playBtn"
onclick="togglePlay()">
▶️ Play
</button>
  
<button
class="ui-control"
onclick="toggleFullscreen()">
⛶ Fullscreen
</button>

</div>

  <div class="speed-container">

<input
class="ui-control"
type="range"
id="speed"
min="50"
max="1000"
value="200"
step="50"
>

<p
class="ui-control"
id="speedText"
>
Kecepatan: 200ms
</p>

</div>
  
<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const urlParams =
new URLSearchParams(window.location.search);

const kodeBooking =
urlParams.get('kode');

let currentImages = [];

let interval;

let isPlaying = false;

let currentIndex = 0;

  document
.getElementById('speed')
.addEventListener('input', function(){

  document.getElementById('speedText')
    .innerText =
    'Kecepatan: ' + this.value + 'ms';

});

loadImages();

async function loadImages(){

  const { data, error } =
    await supabaseClient
    .storage
    .from('customer-photo')
    .list(kodeBooking);

  if(error){
    console.log(error);
    return;
  }

  currentImages = data.map(file =>

`${supabaseUrl}/storage/v1/object/public/customer-photo/${kodeBooking}/${file.name}`

  );
if(currentImages.length > 0){

  document.getElementById('preview')
    .src = currentImages[0];

}
}

function togglePlay(){

  const btn =
    document.getElementById('playBtn');

  if(isPlaying){

    clearInterval(interval);

    isPlaying = false;

    btn.innerHTML = '▶️ Play';

    return;
  }

  isPlaying = true;

  btn.innerHTML = '⏸️ Pause';

  clearInterval(interval);

  interval = setInterval(()=>{

    document.getElementById('preview')
      .src = currentImages[currentIndex];

    currentIndex++;

    if(currentIndex >= currentImages.length){
  currentIndex = 0;
}

  }, document.getElementById('speed').value);

}
  function backToGallery(){

  window.location.href =
`hasil.html?kode=${kodeBooking}`;

}
  
  function toggleFullscreen(){

  const elem =
    document.documentElement;

  const controls =
    document.querySelectorAll('.ui-control');

  if(!document.fullscreenElement){

    elem.requestFullscreen();

    controls.forEach(item=>{
      item.style.display = 'none';
    });

  }else{

    document.exitFullscreen();

    controls.forEach(item=>{
      item.style.display = '';
    });

  }

}
  document.addEventListener(
'fullscreenchange',
()=>{

  const controls =
    document.querySelectorAll('.ui-control');

  if(!document.fullscreenElement){

    controls.forEach(item=>{
      item.style.display = '';
    });

  }

});
</script>

</body>
</html>
