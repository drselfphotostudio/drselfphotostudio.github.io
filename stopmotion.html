<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stop Motion - DR Self Photo Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{--bg:#09090b;--bg2:#111115;--border:rgba(255,255,255,0.07);--accent:#C9A96E;--accent2:#E8C99A;--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:#e8e8f0;font-family:"Poppins",sans-serif;min-height:100vh;overflow-x:hidden;}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(9,9,11,0.92);backdrop-filter:blur(14px);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:100;}
.header-logo img{height:48px;width:auto;object-fit:contain;filter:drop-shadow(0 0 8px rgba(201,169,110,0.25));}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);color:#aaa;padding:9px 18px;border-radius:30px;cursor:pointer;font-size:13px;font-weight:500;font-family:"Poppins",sans-serif;transition:all 0.2s;}
.back-btn:hover{background:rgba(255,255,255,0.1);color:#fff;transform:translateX(-2px);}
.page-hero{text-align:center;padding:36px 24px 20px;}
.page-eyebrow{font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);border:0.5px solid rgba(201,169,110,0.3);padding:5px 16px;border-radius:20px;background:rgba(201,169,110,0.06);display:inline-block;margin-bottom:16px;}
.page-title{font-family:"Playfair Display",serif;font-size:clamp(28px,5vw,48px);font-weight:900;color:#fff;line-height:1.1;}
.page-title em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.main{max-width:860px;margin:0 auto;padding:20px 20px 60px;}
.preview-wrap{position:relative;border-radius:20px;overflow:hidden;background:#000;border:0.5px solid var(--border);box-shadow:0 0 0 1px rgba(201,169,110,0.1),0 32px 80px rgba(0,0,0,0.6);line-height:0;}
.preview-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,169,110,0.05) 0%,transparent 60%);pointer-events:none;z-index:1;}
#preview{width:100%;height:auto;display:block;}

.loading-overlay{position:absolute;inset:0;min-height:300px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:3;}
.spinner{width:40px;height:40px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--accent);letter-spacing:0.08em;}
.progress-bar-wrap{margin-top:14px;height:3px;background:var(--border);border-radius:99px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;width:0%;transition:width 0.1s linear;}
.controls-card{margin-top:20px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:24px;}
.controls-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:28px;}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:30px;cursor:pointer;font-size:14px;font-weight:600;font-family:"Poppins",sans-serif;padding:12px 24px;transition:all 0.2s;}
.btn-play{background:var(--accent);color:#000;box-shadow:0 6px 20px rgba(201,169,110,0.3);min-width:140px;justify-content:center;}
.btn-play:hover{background:var(--accent2);transform:translateY(-2px);}
.btn-fs{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);color:#ccc;}
.btn-dl{background:rgba(201,169,110,0.12);border:0.5px solid rgba(201,169,110,0.3);color:var(--accent);}
.btn-dl:hover{background:rgba(201,169,110,0.2);color:var(--accent2);transform:translateY(-2px);}
.btn-dl:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.dl-progress{display:none;margin-top:16px;text-align:center;}
.dl-bar-wrap{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0 6px;}
.dl-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;width:0%;transition:width 0.1s;}
.dl-label{font-size:12px;color:var(--accent);letter-spacing:0.06em;}
.btn-fs:hover{background:rgba(255,255,255,0.1);color:#fff;transform:translateY(-2px);}
.speed-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.speed-lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:#555;font-weight:500;}
.speed-val{font-size:13px;font-weight:600;color:var(--accent);background:rgba(201,169,110,0.08);border:0.5px solid rgba(201,169,110,0.2);padding:3px 12px;border-radius:20px;}
.speed-row{display:flex;align-items:center;gap:10px;}
.speed-tag{font-size:11px;color:#444;white-space:nowrap;}
#speed{flex:1;-webkit-appearance:none;height:4px;border-radius:99px;background:linear-gradient(to right,var(--accent) 0%,var(--accent) 15%,rgba(255,255,255,0.1) 15%);outline:none;cursor:pointer;}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(201,169,110,0.2);cursor:pointer;}
.hide{display:none!important;}
.watermark{position:absolute;bottom:12px;left:12px;z-index:2;pointer-events:none;}
.watermark img{height:44px;width:auto;object-fit:contain;opacity:0.75;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.7));}
@media(max-width:600px){.header{padding:12px 16px;}.header-logo img{height:36px;}.btn{font-size:13px;padding:10px 18px;}}

</style>
</head>

  <div class="progress-bar-wrap ui-ctrl"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="controls-card ui-ctrl">
    <div class="controls-row">
      <button class="btn btn-play" id="playBtn" onclick="togglePlay()">&#9654; Play</button>
      <button class="btn btn-fs" onclick="toggleFullscreen()">&#x26F6; Fullscreen</button>
      <button class="btn btn-dl" id="dlBtn" onclick="downloadVideo()">&#8595; Download Video</button>
    </div>
    <div class="dl-progress" id="dlProgress">
      <div class="dl-bar-wrap"><div class="dl-bar-fill" id="dlBar"></div></div>
      <div class="dl-label" id="dlLabel">Memproses video...</div>
    </div>
    <div class="speed-label"><span class="speed-lbl">Kecepatan Frame</span><span class="speed-val" id="speedText">200ms</span></div>
    <div class="speed-row"><span class="speed-tag">Cepat</span><input type="range" id="speed" min="50" max="1000" value="200" step="50"><span class="speed-tag">Lambat</span></div>
  </div>
</div>
<script>
const SUPA_URL='https://dokayeukqfzbkktnmcoy.supabase.co';
const SUPA_KEY='sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const p=new URLSearchParams(window.location.search);
const kode=p.get('kode');
let imgs=[],intv,playing=false,idx=0;
const sld=document.getElementById('speed');
const stxt=document.getElementById('speedText');
function updSlider(){
  const mn=+sld.min,mx=+sld.max,v=+sld.value;
  const pct=((v-mn)/(mx-mn)*100).toFixed(1)+'%';
  sld.style.background='linear-gradient(to right,#C9A96E 0%,#C9A96E '+pct+',rgba(255,255,255,0.1) '+pct+')';
  stxt.textContent=v+'ms';
}
sld.addEventListener('input',()=>{updSlider();if(playing){clearInterval(intv);startPlay();}});
updSlider();
async function loadImages(){

  const { data, error } = await sb.storage
    .from('customer-photo')
    .list(kode,{limit:100});

  const ov=document.getElementById('loadingOverlay');
  ov.style.opacity='0';
  setTimeout(()=>ov.style.display='none',400);

  if(error){
    console.error(error);
    return;
  }

  if(!data || data.length===0){
    console.log('Folder kosong');
    return;
  }

  imgs=data
    .filter(f =>
      f.name &&
      !f.name.startsWith('.') &&
      /\.(jpg|jpeg|png|webp)$/i.test(f.name)
    )
    .sort((a,b)=>
      a.name.localeCompare(
        b.name,
        undefined,
        {numeric:true}
      )
    )
    .map(f =>
      `${SUPA_URL}/storage/v1/object/public/customer-photo/${kode}/${f.name}`
    );

  console.log('Jumlah foto:',imgs.length);
  console.log(imgs);

  if(imgs.length){
    document.getElementById('preview').src=imgs[0];
  }
}
  document.getElementById('preview').src=imgs[0];
  document.getElementById('preview').onerror=e=>{
  console.error('Gagal load gambar',e.target.src);
};
function updBadge(){
  const t=imgs.length;
  document.getElementById('progressFill').style.width=t>1?(idx/(t-1)*100)+'%':'0%';
}
function startPlay(){
  intv=setInterval(()=>{
    document.getElementById('preview').src=imgs[idx];
    updBadge();
    idx=(idx+1)%imgs.length;
  },+sld.value);
}
function togglePlay(){
  const btn=document.getElementById('playBtn');
  if(playing){clearInterval(intv);playing=false;btn.innerHTML='&#9654; Play';return;}
  if(!imgs.length)return;
  playing=true;btn.innerHTML='&#9646;&#9646; Pause';startPlay();
}
function backToGallery(){
  const adm=p.get('admin');
  window.location.href=adm?'hasil.html?kode='+kode+'&admin=1':'hasil.html?kode='+kode;
}
function toggleFullscreen(){
  const ctrls=document.querySelectorAll('.ui-ctrl');
  if(!document.fullscreenElement){document.documentElement.requestFullscreen();ctrls.forEach(e=>e.classList.add('hide'));}
  else{document.exitFullscreen();ctrls.forEach(e=>e.classList.remove('hide'));}
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement)document.querySelectorAll('.ui-ctrl').forEach(e=>e.classList.remove('hide'));
});
async function downloadVideo(){

  if(!imgs.length){
    alert('Foto belum dimuat');
    return;
  }

  const btn=document.getElementById('dlBtn');
  const prog=document.getElementById('dlProgress');
  const bar=document.getElementById('dlBar');
  const lbl=document.getElementById('dlLabel');

  btn.disabled=true;
  prog.style.display='block';

  try{

    lbl.textContent='Membuat video...';

    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d');

    const first=new Image();
first.crossOrigin='anonymous';
first.src=imgs[0];

    await new Promise(r=>{
      first.onload=r;
    });

    canvas.width=1080;
canvas.height=1920;

    const stream=canvas.captureStream(1000/(+sld.value));

    const recorder=new MediaRecorder(stream,{
  mimeType:'video/webm;codecs=vp8'
});

    console.log('MediaRecorder supported:',
MediaRecorder.isTypeSupported('video/webm'));
    const chunks=[];

    recorder.ondataavailable=e=>{
      if(e.data.size){
        chunks.push(e.data);
      }
    };

    recorder.start(100);

    const wm=document.querySelector('.watermark img');

    for(let i=0;i<imgs.length;i++){
      console.log(
  'Frame video',
  i+1,
  '/',
  imgs.length,
  imgs[i]
);

      const img=new Image();
img.crossOrigin='anonymous';
img.src=imgs[i];

      await new Promise(r=>{
  img.onload=r;
});

ctx.clearRect(0,0,canvas.width,canvas.height);

const ratio = Math.max(
  canvas.width / img.width,
  canvas.height / img.height
);

const w = img.width * ratio;
const h = img.height * ratio;

const x = (canvas.width - w) / 2;
const y = (canvas.height - h) / 2;

ctx.drawImage(
  img,
  x,
  y,
  w,
  h
);

if(wm){

  const wmW=canvas.width*0.12;
  const wmH=wm.height*(wmW/wm.width);

  ctx.globalAlpha=0.75;

  ctx.drawImage(
    wm,
    20,
    canvas.height-wmH-20,
    wmW,
    wmH
  );

  ctx.globalAlpha=1;
}

// paksa browser menggambar dulu
await new Promise(r=>requestAnimationFrame(r));

// paksa kirim frame ke recorder
stream.getVideoTracks()[0].requestFrame?.();

// beri jeda lebih lama
await new Promise(r=>setTimeout(r,1000));
      
      bar.style.width=((i+1)/imgs.length*100)+'%';
      lbl.textContent='Frame '+(i+1)+' / '+imgs.length;

      await new Promise(r=>
        setTimeout(r,+sld.value)
      );
    }

    recorder.requestData();
await new Promise(r=>setTimeout(r,300));
await new Promise(r=>setTimeout(r,1000));
await new Promise(r=>setTimeout(r,2000));
recorder.stop();

    await new Promise(resolve=>{
      recorder.onstop=resolve;
    });

    if(chunks.length===0){
  throw new Error('Video kosong (chunks = 0)');
}

const blob=new Blob(
  chunks,
  {type:'video/webm'}
);

console.log('Video size:',blob.size);

    const url=URL.createObjectURL(blob);

    const a=document.createElement('a');

    a.href=url;
    a.download='stopmotion-'+kode+'.webm';

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

    lbl.textContent='Video berhasil dibuat';

  }catch(err){

    console.error(err);
    lbl.textContent='Gagal : '+err.message;

  }finally{

    btn.disabled=false;

    setTimeout(()=>{
      prog.style.display='none';
      bar.style.width='0%';
    },3000);

  }
}

loadImages();
</script>
