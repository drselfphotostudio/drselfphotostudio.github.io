<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Template Photostrip</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins,sans-serif;
    }

    body{
      background:#000;
      color:white;
      padding:40px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .header h1{
      font-size:42px;
    }

    .back-btn{
      background:#1d1d1d;
      color:white;
      padding:14px 20px;
      border-radius:14px;
      text-decoration:none;
    }

    .card{
      background:#111;
      padding:30px;
      border-radius:24px;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:#1d1d1d;
      color:white;
      margin-bottom:20px;
    }

    .submit-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:white;
      color:black;
      font-weight:600;
      cursor:pointer;
    }

    .template-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .template-item{
      background:#111;
      border-radius:20px;
      overflow:hidden;
      padding:15px;
    }

    .template-item img{
      width:100%;
      border-radius:14px;
    }

    .template-item h3{
      margin-top:15px;
      margin-bottom:15px;
    }

    .delete-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:#ff3b3b;
      color:white;
      cursor:pointer;
    }

  </style>
</head>
<body>

<div class="container">

  <div class="header">

    <h1>Template Photostrip</h1>

    <a
      href="admin.html"
      class="back-btn"
    >
      ← Kembali Dashboard
    </a>

  </div>

  <div class="card">

    <form id="templateForm">

      <input
        type="text"
        id="name"
        placeholder="Nama Template"
        required
      >

      <input
        type="file"
        id="image"
        accept="image/*"
        required
      >

      <button
        class="submit-btn"
        type="submit"
      >
        Upload Template
      </button>

    </form>

  </div>

  <div
    class="template-grid"
    id="templateList"
  ></div>

</div>

<script>

const supabaseUrl =
'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey =
'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
)

const templateForm =
document.getElementById('templateForm')

const templateList =
document.getElementById('templateList')

async function loadTemplate(){

  const { data, error } =
  await supabaseClient
    .from('template')
    .select('*')
    .order('id',{ascending:false})

  if(error){
    console.log(error)
    return
  }

  templateList.innerHTML =
  data.map(item => `

    <div class="template-item">

      <img src="${item.image_url}">

      <h3>${item.name}</h3>

      <button
        class="delete-btn"
        onclick="deleteTemplate(${item.id})"
      >
        Hapus
      </button>

    </div>

  `).join('')

}

loadTemplate()

templateForm.addEventListener(
'submit',
async(e)=>{

  e.preventDefault()

  const name =
  document.getElementById('name').value

  const imageFile =
  document.getElementById('image').files[0]

  const fileName =
  Date.now() + '-' + imageFile.name

  const { error: uploadError } =
  await supabaseClient.storage
    .from('template')
    .upload(fileName, imageFile)

  if(uploadError){
    console.log(uploadError)
    alert('Upload gagal')
    return
  }

  const {
    data: publicUrlData
  } = supabaseClient.storage
    .from('template')
    .getPublicUrl(fileName)

  const imageUrl =
  publicUrlData.publicUrl

  await supabaseClient
    .from('template')
    .insert([
      {
        name:name,
        image_url:imageUrl,
        active:true
      }
    ])

  alert('Template berhasil upload 🎉')

  templateForm.reset()

  loadTemplate()

})

async function deleteTemplate(id){

  const confirmDelete =
  confirm('Hapus template ini?')

  if(!confirmDelete) return

  await supabaseClient
    .from('template')
    .delete()
    .eq('id', id)

  loadTemplate()

}

</script>

</body>
</html>
