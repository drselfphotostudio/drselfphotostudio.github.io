<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download Foto Customer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:'Poppins',sans-serif;
}

.header{
  text-align:center;
  padding:40px 20px;
}

.header h1{
  margin:0;
  font-size:42px;
}

.header p{
  opacity:0.7;
  margin-top:10px;
}

.gallery{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  display:block;
}

.download-btn{
  display:block;
  text-align:center;
  background:#25D366;
  color:white;
  text-decoration:none;
  padding:15px;
  font-weight:600;
  transition:0.3s;
}

.download-btn:hover{
  background:#1ebe5d;
}

.loading{
  text-align:center;
  padding:60px 20px;
  opacity:0.8;
}

.empty{
  text-align:center;
  padding:60px 20px;
  opacity:0.7;
}

footer{
  text-align:center;
  padding:40px 20px;
  opacity:0.5;
}

</style>
</head>

<body>

<div class="header">
  <h1>Download Foto</h1>
  <p>DR Self Photo Studio</p>
</div>

<div id="loading" class="loading">
  Memuat foto...
</div>

<div class="gallery" id="gallery"></div>

<div id="empty" class="empty" style="display:none;">
  Foto tidak ditemukan
</div>

<footer>
  © 2026 DR Self Photo Studio
</footer>

<script>

const params = new URLSearchParams(window.location.search);

const kode = params.get('id');

const gallery = document.getElementById('gallery');

const loading = document.getElementById('loading');

const empty = document.getElementById('empty');

loading.style.display = 'none';

/*
========================================
TAMBAHKAN CUSTOMER DI SINI
========================================
*/

const customerPhotos = {

  "DR25001": [
    "https://dokayeukqfzbkktnmcoy.supabase.co/storage/v1/object/public/customer-photo/DR25001/foto1.jpeg"
  ],

  /*
  Contoh tambah customer baru:

  "DR25002": [
    "LINK_FOTO_1",
    "LINK_FOTO_2"
  ],
  */

};

if(customerPhotos[kode]){

  customerPhotos[kode].forEach(imageUrl => {

    gallery.innerHTML += `
    
      <div class="card">

        <img src="${imageUrl}" alt="Foto Customer">

        <a class="download-btn" href="${imageUrl}" download>
          Download Foto
        </a>

      </div>

    `;
  });

}else{

  empty.style.display = 'block';

}

</script>

</body>
</html>
