<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download Foto Customer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:'Poppins',sans-serif;
}

.header{
  text-align:center;
  padding:40px 20px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  opacity:0.7;
}

.gallery{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.card img{
  width:100%;
  display:block;
}

.download-btn{
  display:block;
  text-align:center;
  background:#25D366;
  color:white;
  text-decoration:none;
  padding:14px;
  font-weight:600;
}

.loading{
  text-align:center;
  padding:50px;
}

.empty{
  text-align:center;
  padding:50px;
  opacity:0.7;
}

</style>
</head>

<body>

<div class="header">
  <h1>Download Foto</h1>
  <p>DR Self Photo Studio</p>
</div>

<div id="loading" class="loading">
  Memuat foto...
</div>

<div class="gallery" id="gallery"></div>

<div id="empty" class="empty" style="display:none;">
  Foto tidak ditemukan
</div>

<script>

const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const params = new URLSearchParams(window.location.search);

const kode = params.get('id');

async function loadGallery(){

  const loading = document.getElementById('loading');
  const gallery = document.getElementById('gallery');
  const empty = document.getElementById('empty');

  const { data, error } = await supabaseClient
  .storage
  .from('customer-photo')
  .list(kode, {
    limit: 100,
    offset: 0
  });

  loading.style.display = 'none';

  if(error || !data || data.length === 0){
    empty.style.display = 'block';
    return;
  }

  data.forEach(file => {

    const imageUrl =
      `${supabaseUrl}/storage/v1/object/public/customer-photo/${kode}/${file.name}`;

    gallery.innerHTML += `
      <div class="card">
        <img src="${imageUrl}">
        <a class="download-btn" href="${imageUrl}" download>
          Download Foto
        </a>
      </div>
    `;
  });

}

loadGallery();

</script>

</body>
</html>
