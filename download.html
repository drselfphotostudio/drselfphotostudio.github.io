<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download Foto Customer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:
  radial-gradient(circle at top,#101828,#050505 70%);
  color:white;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
}

.header{
  text-align:center;
  padding:60px 20px 40px;
}

.header h1{
  margin:0;
  font-size:58px;
  font-weight:800;
}

.header h1 span{
  color:#25D366;
}

.header p{
  opacity:.75;
  margin-top:10px;
  font-size:18px;
}

.gallery{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
  padding:30px;
}

.card{
  background:#141414;
  border-radius:24px;
  overflow:hidden;
  position:relative;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:
  0 15px 40px rgba(0,0,0,.45);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:350px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.download-btn{
  display:block;
  text-align:center;
  background:#25D366;
  color:white;
  text-decoration:none;
  padding:15px;
  font-weight:600;
  transition:0.3s;
  border:none;
width:100%;
cursor:pointer;
font-size:16px;
}

.download-btn:hover{
  background:#1ebe5d;
}

.loading{
  text-align:center;
  padding:60px 20px;
  opacity:0.8;
}

.empty{
  text-align:center;
  padding:60px 20px;
  opacity:0.7;
}

  .preview-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
}

.preview-modal img{
  width:auto;
  height:auto;
  max-width:95vw;
  max-height:95vh;
  border-radius:20px;
  object-fit:contain;
}

.close-preview{
  position:absolute;
  top:20px;
  right:30px;
  font-size:50px;
  cursor:pointer;
  color:white;
}
footer{
  text-align:center;
  padding:40px 20px;
  opacity:0.5;
}
.kode-card{
  display:inline-block;
  margin-top:20px;
  background:#181818;
  padding:14px 24px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  font-weight:600;
}

.kode-card span{
  color:#25D366;
}

.photo-number{
  position:absolute;
  top:12px;
  left:12px;
  background:#25D366;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  z-index:5;
}

.photo-info{
  padding:18px;
}

.file-name{
  font-size:15px;
  font-weight:600;
  margin-bottom:14px;
}
</style>
</head>

<body>

<div class="header">

<div style="font-size:60px;">
📥
</div>

<h1>
Download <span>Foto</span>
</h1>

<p>DR Self Photo Studio</p>

<div class="kode-card">
🛡️ Kode Booking :
<span id="kodeBookingText"></span>
</div>

</div>

<div id="loading" class="loading">
  Memuat foto...
</div>

<div class="gallery" id="gallery"></div>

<div id="empty" class="empty" style="display:none;">
  Foto tidak ditemukan
</div>

  <div id="previewModal" class="preview-modal">

  <span class="close-preview" onclick="closePreview()">
    ×
  </span>

  <img id="previewImage">

</div>
<footer>
  © 2026 DR Self Photo Studio
</footer>

<script>

const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const params = new URLSearchParams(window.location.search);

const kode = params.get('id');
  document.addEventListener(
'DOMContentLoaded',
() => {

  const el =
  document.getElementById(
    'kodeBookingText'
  );

  if(el){
    el.textContent = kode || '-';
  }

});

const gallery = document.getElementById('gallery');

const loading = document.getElementById('loading');

const empty = document.getElementById('empty');

async function loadGallery(){

  const { data: files, error } = await supabaseClient
    .storage
    .from('customer-photo')
    .list(kode);

  console.log(files);

  loading.style.display = 'none';

  if(error || !files || files.length === 0){

    empty.style.display = 'block';

    return;
  }

  files.forEach((file, index) => {

    const imageUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kode}/${file.name}`;

const downloadUrl =
`${imageUrl}?download=1`;

    gallery.innerHTML += `

<div class="card">

<div class="photo-number">
${String(index+1).padStart(2,'0')}
</div>

<img
src="${imageUrl}"
alt="Foto Customer"
loading="lazy"
onclick="openPreview('${imageUrl}')"
>

<div class="photo-info">

<div class="file-name">
${kode}-${String(index+1).padStart(2,'0')}.jpg
</div>

<button
class="download-btn"
onclick="downloadPhoto('${downloadUrl}','${kode}-${index+1}.jpg')"
>
⬇ Download Foto
</button>

</div>

</div>

`;
  });

}

loadGallery();
  function openPreview(imageUrl){

  document.getElementById('previewModal')
    .style.display = 'flex';

  document.getElementById('previewImage')
    .src = imageUrl;

}
async function downloadPhoto(url, fileName){

  const response = await fetch(url);

  const blob = await response.blob();

  const blobUrl = window.URL.createObjectURL(blob);

  const link = document.createElement('a');

  link.href = blobUrl;

  link.download = fileName;

  document.body.appendChild(link);

  link.click();

  link.remove();

  window.URL.revokeObjectURL(blobUrl);

}
function closePreview(){

  document.getElementById('previewModal')
    .style.display = 'none';

}

</script>

</body>
</html>
