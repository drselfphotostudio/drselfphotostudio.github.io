<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download Foto Customer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:'Poppins',sans-serif;
}

.header{
  text-align:center;
  padding:40px 20px;
}

.header h1{
  margin:0;
  font-size:42px;
}

.header p{
  opacity:0.7;
  margin-top:10px;
}

.gallery{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:350px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.download-btn{
  display:block;
  text-align:center;
  background:#25D366;
  color:white;
  text-decoration:none;
  padding:15px;
  font-weight:600;
  transition:0.3s;
  border:none;
width:100%;
cursor:pointer;
font-size:16px;
}

.download-btn:hover{
  background:#1ebe5d;
}

.loading{
  text-align:center;
  padding:60px 20px;
  opacity:0.8;
}

.empty{
  text-align:center;
  padding:60px 20px;
  opacity:0.7;
}

  .preview-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
}

.preview-modal img{
  width:auto;
  height:auto;
  max-width:95vw;
  max-height:95vh;
  border-radius:20px;
  object-fit:contain;
}

.close-preview{
  position:absolute;
  top:20px;
  right:30px;
  font-size:50px;
  cursor:pointer;
  color:white;
}
footer{
  text-align:center;
  padding:40px 20px;
  opacity:0.5;
}

</style>
</head>

<body>

<div class="header">
  <h1>Download Foto</h1>
  <p>DR Self Photo Studio</p>
</div>

<div id="loading" class="loading">
  Memuat foto...
</div>

<div class="gallery" id="gallery"></div>

<div id="empty" class="empty" style="display:none;">
  Foto tidak ditemukan
</div>

  <div id="previewModal" class="preview-modal">

  <span class="close-preview" onclick="closePreview()">
    ×
  </span>

  <img id="previewImage">

</div>
<footer>
  © 2026 DR Self Photo Studio
</footer>

<script>

const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const params = new URLSearchParams(window.location.search);

const kode = params.get('id');

const gallery = document.getElementById('gallery');

const loading = document.getElementById('loading');

const empty = document.getElementById('empty');

async function loadGallery(){

  const { data: files, error } = await supabaseClient
    .storage
    .from('customer-photo')
    .list(kode);

  console.log(files);

  loading.style.display = 'none';

  if(error || !files || files.length === 0){

    empty.style.display = 'block';

    return;
  }

  files.forEach((file, index) => {

    const imageUrl =
`${supabaseUrl}/storage/v1/object/public/customer-photo/${kode}/${file.name}`;

const downloadUrl =
`${imageUrl}?download=1`;

    gallery.innerHTML += `
    
<div class="card">

  <img 
    src="${imageUrl}"
    alt="Foto Customer"
    loading="lazy"
    onclick="openPreview('${imageUrl}')"
  >

  <button 
  class="download-btn"
  onclick="downloadPhoto('${downloadUrl}','${kode}-${index + 1}.jpg')"
>
  Download Foto
</button>
</div>

`;
  });

}

loadGallery();
  function openPreview(imageUrl){

  document.getElementById('previewModal')
    .style.display = 'flex';

  document.getElementById('previewImage')
    .src = imageUrl;

}
async function downloadPhoto(url, fileName){

  const response = await fetch(url);

  const blob = await response.blob();

  const blobUrl = window.URL.createObjectURL(blob);

  const link = document.createElement('a');

  link.href = blobUrl;

  link.download = fileName;

  document.body.appendChild(link);

  link.click();

  link.remove();

  window.URL.revokeObjectURL(blobUrl);

}
function closePreview(){

  document.getElementById('previewModal')
    .style.display = 'none';

}

</script>

</body>
</html>
