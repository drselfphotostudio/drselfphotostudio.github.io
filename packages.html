<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Admin Paket Harga</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Poppins, sans-serif;
    }

    body{
      background:#000;
      color:white;
      padding:40px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .header h1{
      font-size:40px;
      font-weight:700;
    }

    .back-btn{
      padding:12px 20px;
      border:none;
      border-radius:12px;
      background:#1e1e1e;
      color:white;
      cursor:pointer;
      text-decoration:none;
    }

    .card{
      background:#111;
      border-radius:24px;
      padding:30px;
      margin-bottom:30px;
    }

    .card h2{
      margin-bottom:20px;
      font-size:28px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:#1d1d1d;
      color:white;
      font-size:16px;
    }

    .submit-btn{
      margin-top:20px;
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:white;
      color:black;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
    }

    .packages{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }

    .package-card{
      background:#1a1a1a;
      border-radius:20px;
      padding:25px;
    }

    .package-card h3{
      font-size:28px;
      margin-bottom:10px;
    }

    .package-card h4{
      font-size:24px;
      margin-bottom:20px;
    }

    .package-card p{
      margin-bottom:10px;
      color:#ccc;
    }

    .btn-group{
      display:flex;
      gap:10px;
      margin-top:20px;
    }

    .edit-btn,
    .delete-btn{
      flex:1;
      padding:12px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
    }

    .edit-btn{
      background:white;
      color:black;
    }

    .delete-btn{
      background:#ff3b3b;
      color:white;
    }

    @media(max-width:768px){

      body{
        padding:20px;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
      }

    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Paket Harga</h1>

      <a href="admin.html" class="back-btn">
        ← Kembali Dashboard
      </a>
    </div>

    <div class="card">

      <h2>Tambah / Edit Paket</h2>

      <form id="packageForm">

        <input type="hidden" id="packageId">

        <div class="form-grid">

          <input
            type="text"
            id="name"
            placeholder="Nama Paket"
            required
          >

          <input
            type="text"
            id="price"
            placeholder="Harga"
            required
          >

          <input
            type="text"
            id="duration"
            placeholder="Durasi"
            required
          >

          <input
            type="text"
            id="files"
            placeholder="File"
            required
          >

          <input
            type="text"
            id="people"
            placeholder="Jumlah Orang"
            required
          >

          <input
            type="text"
            id="bonus"
            placeholder="Bonus"
            required
          >

        </div>

        <button class="submit-btn" type="submit">
          Simpan Paket
        </button>

      </form>

    </div>

    <div class="packages" id="packageList"></div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>

const supabaseUrl = 'https://dokayeukqfzbkktnmcoy.supabase.co';

const supabaseKey = 'sb_publishable_iUb2y0mBwhZN_Lkqq-PH_A_JCozJTxT';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
)

const packageForm = document.getElementById("packageForm")
const packageList = document.getElementById("packageList")

async function loadPackages(){

  const { data, error } = await supabaseClient
    .from("packages")
    .select("*")
    .order("id", { ascending:true })

  if(error){
    console.log(error)
    return
  }

  packageList.innerHTML = data.map(pkg => `
  
    <div class="package-card">

      <h3>${pkg.name}</h3>
      <h4>${pkg.price}</h4>

      <p>${pkg.duration}</p>
      <p>${pkg.files}</p>
      <p>${pkg.people}</p>
      <p>${pkg.bonus}</p>

      <div class="btn-group">

        <button
          class="edit-btn"
          onclick="editPackage(${pkg.id})"
        >
          Edit
        </button>

        <button
          class="delete-btn"
          onclick="deletePackage(${pkg.id})"
        >
          Hapus
        </button>

      </div>

    </div>

  `).join("")
}

loadPackages()

packageForm.addEventListener("submit", async(e)=>{

  e.preventDefault()

  const id = document.getElementById("packageId").value

  const payload = {
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    duration: document.getElementById("duration").value,
    files: document.getElementById("files").value,
    people: document.getElementById("people").value,
    bonus: document.getElementById("bonus").value,
    active: true
  }

  if(id){

    await supabaseClient
      .from("packages")
      .update(payload)
      .eq("id", id)

  }else{

    await supabaseClient
      .from("packages")
      .insert([payload])

  }

  packageForm.reset()

  loadPackages()
})

async function deletePackage(id){

  await supabaseClient
    .from("packages")
    .delete()
    .eq("id", id)

  loadPackages()
}

async function editPackage(id){

  const { data } = await supabaseClient
    .from("packages")
    .select("*")
    .eq("id", id)
    .single()

  document.getElementById("packageId").value = data.id
  document.getElementById("name").value = data.name
  document.getElementById("price").value = data.price
  document.getElementById("duration").value = data.duration
  document.getElementById("files").value = data.files
  document.getElementById("people").value = data.people
  document.getElementById("bonus").value = data.bonus
}

</script>
</body>
</html>
